				<text x="4" y="257.16" class="st2" v:langID="1033"><v:paragraph v:spBefore="6" v:spAfter="6"/><v:tabList/>Rapid PVST+<v:newlineChar/><v:paragraph
							v:indentFirst="-18" v:indentLeft="18" v:bullet="3"/><tspan x="4" dy="1.946em" class="st3"
							v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan class="st4">Cisco</tspan><tspan
							class="st4">’</tspan><tspan class="st4">s implementation of 802.1W (RSTP).<v:newlineChar/><v:paragraph
								v:indentFirst="-18" v:indentLeft="18" v:bullet="3"/></tspan><tspan x="4" dy="1.217em" class="st3"
							v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan class="st4">Fast convergence </tspan><tspan
							class="st4">(1</tspan><tspan class="st4">–</tspan><tspan class="st4">3 </tspan><tspan class="st4">seconds).<v:newlineChar/></tspan><tspan
							x="4" dy="1.217em" class="st3" v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan
							class="st4">Runs one RSTP instance per VLAN.<v:newlineChar/></tspan><tspan x="4" dy="1.217em"
							class="st3" v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan class="st4">Also supports 802.1Q trunks and legacy STP </tspan><tspan
							x="22" dy="1.204em" class="st4">compatibility.<v:newlineChar/></tspan><tspan x="4" dy="1.3em"
							class="st3" v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan class="st4">Default STP version on all modern Cisco switches.</tspan></text>			</g>
