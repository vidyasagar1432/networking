				<text x="4" y="245.84" class="st2" v:langID="1033"><v:paragraph v:spBefore="6" v:spAfter="6"/><v:tabList/>Spanning-Tree Protocol (802.1D)<v:newlineChar/><v:paragraph
							v:indentFirst="-18" v:indentLeft="18" v:bullet="3"/><tspan x="4" dy="1.946em" class="st3"
							v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan class="st4">Original version of STP.<v:newlineChar/></tspan><tspan
							x="4" dy="1.217em" class="st3" v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan
							class="st4">Slow convergence: up to </tspan><tspan class="st4">30</tspan><tspan class="st4">–</tspan><tspan
							class="st4">50 </tspan><tspan class="st4">seconds after a </tspan><tspan x="22" dy="1.204em"
							class="st4">failure.<v:newlineChar/></tspan><tspan x="4" dy="1.213em" class="st3" v:isBullet="true">§</tspan><tspan
							class="st3"> </tspan><tspan class="st4">One STP instance for the entire network (all VLANs </tspan><tspan
							x="22" dy="1.204em" class="st4">share one tree).<v:newlineChar/></tspan><tspan x="4" dy="1.3em"
							class="st3" v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan class="st4">Not efficient for VLAN</tspan><tspan
							class="st4">-</tspan><tspan class="st4">based designs.</tspan></text>			</g>
			<g id="shape2-25" v:mID="2" v:groupContext="shape" transform="translate(5.66929,-97.7999)">
				<title>Rectangle.2</title>
				<desc>Rapid Spanning-Tree Protocol (802.1w) An improved version of ...</desc>
				<v:userDefs>
					<v:ud v:nameU="visVersion" v:val="VT0(15):26"/>
				</v:userDefs>
				<v:textBlock v:margins="rect(4,4,4,4)" v:tabSpace="42.5197" v:verticalAlign="0"/>
				<v:textRect cx="116.22" cy="291.459" width="232.45" height="90.7273"/>
				<rect x="0" y="246.095" width="232.441" height="90.7273" rx="2" ry="2" class="st1"/>
				<text x="4" y="260" class="st2" v:langID="1033"><v:paragraph v:spAfter="6"/><v:tabList/>Rapid Spanning-Tree Protocol (802.1w)<v:newlineChar/><v:paragraph
							v:indentFirst="-18" v:indentLeft="18" v:bullet="3"/><tspan x="4" dy="1.946em" class="st3"
							v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan class="st4">An improved version of STP.<v:newlineChar/></tspan><tspan
							x="4" dy="1.217em" class="st3" v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan
							class="st4">Much faster convergence: usually </tspan><tspan class="st4">1</tspan><tspan class="st4">–</tspan><tspan
							class="st4">3 </tspan><tspan class="st4">seconds.<v:newlineChar/></tspan><tspan x="4" dy="1.217em"
							class="st3" v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan class="st4">Uses new port roles and faster transition </tspan><tspan
							x="22" dy="1.204em" class="st4">mechanisms.<v:newlineChar/></tspan><tspan x="4" dy="1.3em" class="st3"
							v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan class="st4">Still one instance for all VLANs.</tspan></text>			</g>
			<g id="shape3-45" v:mID="3" v:groupContext="shape" transform="translate(5.66929,0)">
				<title>Rectangle.3</title>
				<desc>Multiple Spanning-Tree Protocol (802.1s) Allows multiple VLAN...</desc>
				<v:userDefs>
					<v:ud v:nameU="visVersion" v:val="VT0(15):26"/>
				</v:userDefs>
				<v:textBlock v:margins="rect(4,4,4,4)" v:tabSpace="42.5197" v:verticalAlign="0"/>
				<v:textRect cx="116.22" cy="291.459" width="232.45" height="90.7273"/>
				<rect x="0" y="246.095" width="232.441" height="90.7273" rx="2" ry="2" class="st1"/>
				<text x="4" y="260" class="st2" v:langID="1033"><v:paragraph v:spAfter="6"/><v:tabList/>Multiple Spanning-Tree Protocol (802.1s)<v:newlineChar/><v:paragraph
							v:indentFirst="-18" v:indentLeft="18" v:bullet="3"/><tspan x="4" dy="1.946em" class="st3"
							v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan class="st4">Allows multiple VLANs to share the same STP </tspan><tspan
							x="22" dy="1.204em" class="st4">instance.<v:newlineChar/></tspan><tspan x="4" dy="1.213em" class="st3"
							v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan class="st4">More scalable: reduces CPU/memory load.<v:newlineChar/></tspan><tspan
							x="4" dy="1.217em" class="st3" v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan
							class="st4">Works by mapping VLANs to MST instances </tspan><tspan x="22" dy="1.204em" class="st4">(MSTIs).<v:newlineChar/></tspan><tspan
							x="4" dy="1.3em" class="st3" v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan class="st4">Built on top of RSTP (so convergence is fast).</tspan></text>			</g>
