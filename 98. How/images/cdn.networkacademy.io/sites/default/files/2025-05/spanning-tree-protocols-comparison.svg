				<v:textRect cx="114.803" cy="296.429" width="229.61" height="80.7874"/>
				<rect x="0" y="256.035" width="229.606" height="80.7874" rx="2" ry="2" class="st1"/>
				<text x="4" y="269.94" class="st2" v:langID="1033"><v:paragraph v:spBefore="6" v:spAfter="6"/><v:tabList/>PVST+ (Per VLAN Spanning Tree Plus)<v:newlineChar/><v:paragraph
							v:indentFirst="-18" v:indentLeft="18" v:bullet="3"/><tspan x="4" dy="1.946em" class="st3"
							v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan class="st4">Cisco proprietary. Based on 802.1D (STP).<v:newlineChar/><v:paragraph
								v:indentFirst="-18" v:indentLeft="18" v:bullet="3"/></tspan><tspan x="4" dy="1.217em" class="st3"
							v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan class="st4">Runs one STP instance per VLAN.<v:newlineChar/></tspan><tspan
							x="4" dy="1.217em" class="st3" v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan
							class="st4">Supports ISL and 802.1Q trunks.<v:newlineChar/></tspan><tspan x="4" dy="1.217em"
							class="st3" v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan class="st4">Allows interoperability with standard STP (802.1D).<v:newlineChar/></tspan><tspan
							x="4" dy="1.304em" class="st3" v:isBullet="true">§</tspan><tspan class="st3"> </tspan><tspan
							class="st4">Slow convergence </tspan><tspan class="st4">(30</tspan><tspan class="st4">–</tspan><tspan
							class="st4">50 </tspan><tspan class="st4">seconds).</tspan></text>			</g>
