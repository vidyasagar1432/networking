			<g id="shape1045-99" v:mID="1045" v:groupContext="shape" transform="translate(287.717,-78.7555)">
				<title>Sheet.1045</title>
				<desc>The carrier wave&#39;s phase is shifted by 180 degrees each time ...</desc>
				<v:textBlock v:margins="rect(4,4,4,4)" v:tabSpace="42.5197"/>
				<v:textRect cx="66.6142" cy="110.947" width="133.23" height="38.2677"/>
				<rect x="0" y="91.813" width="133.228" height="38.2677" class="st1"/>
				<text x="4" y="99.7" class="st9" v:langID="1033"><v:paragraph v:spLine="-1"/><v:tabList/>The carrier wave&#39;s phase is <tspan
							x="4" dy="1em" class="st10">shifted by 180 degrees each </tspan><tspan x="4" dy="1em" class="st10">time a binary digit changes. </tspan><tspan
							x="4" dy="1em" class="st10">(“</tspan>phase flips”)</text>			</g>
			<g id="shape1046-105" v:mID="1046" v:groupContext="shape" transform="translate(259.37,0)">
				<title>Sheet.1046</title>
