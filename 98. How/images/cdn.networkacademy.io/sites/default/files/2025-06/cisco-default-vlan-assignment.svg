			<g id="shape56-88" v:mID="56" v:groupContext="shape" transform="translate(257.953,-59.9924)">
				<title>Sheet.56</title>
				<desc>By default, all switchports on a Cisco switch are assigned to...</desc>
				<v:textBlock v:margins="rect(6,4,4,4)" v:tabSpace="42.5197" v:verticalAlign="0"/>
				<v:textRect cx="104.882" cy="134.5" width="209.77" height="84.1098"/>
				<path d="M42.36 159.31 L204.09 159.31 A5.66929 4.81011 -180 0 0 209.76 154.5 L209.76 97.26 A5.66929 4.81011 -180
							 0 0 204.09 92.45 L5.67 92.45 A5.66929 4.81011 -180 0 0 -0 97.26 L0 154.5 A5.66929 4.81011 -180 0 0 5.67
							 159.31 L27.73 159.31 L35.04 176.55 L42.36 159.31 Z" class="st9"/>
				<text x="7.17" y="108.35" class="st10" v:langID="1033"><v:paragraph v:spLine="-1.1" v:horizAlign="1"/><v:tabList/>By default, all switchports on a Cisco <tspan
							x="4.86" dy="1.1em" class="st11">switch </tspan><tspan class="st12">are assigned to VLAN 1</tspan>. This <tspan
							x="8.83" dy="1.1em" class="st11">means the entire switch operates as </tspan><tspan x="27.53"
							dy="1.1em" class="st12">a single broadcast domain</tspan>.</text>			</g>
