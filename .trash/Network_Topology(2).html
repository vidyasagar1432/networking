<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Topology - Interactive Learning Lab</title>
<style>
  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --bg-card: #1c2128;
    --border-color: #30363d;
    --text-primary: #c9d1d9;
    --text-secondary: #8b949e;
    --text-accent: #58a6ff;
    --accent-blue: #58a6ff;
    --accent-green: #3fb950;
    --accent-orange: #f0883e;
    --accent-red: #f85149;
    --accent-purple: #a371f7;
    --accent-cyan: #39c5cf;
    --accent-yellow: #d29922;
    --device-router: #f0883e;
    --device-switch: #58a6ff;
    --device-pc: #3fb950;
    --device-server: #a371f7;
    --link-active: #3fb950;
    --link-inactive: #30363d;
    --packet-color: #f0883e;
    --shadow: rgba(0,0,0,0.3);
    --glow-blue: 0 0 10px rgba(88,166,255,0.3);
    --glow-green: 0 0 10px rgba(63,185,80,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header h1 {
    font-size: 1.5rem;
    color: var(--accent-blue);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .header h1::before {
    content: "◈";
    color: var(--accent-green);
  }

  .header-subtitle {
    color: var(--text-secondary);
    font-size: 0.85rem;
  }

  /* Navigation Tabs */
  .nav-tabs {
    display: flex;
    gap: 0.25rem;
    background: var(--bg-secondary);
    padding: 0.5rem 2rem 0;
    border-bottom: 1px solid var(--border-color);
    overflow-x: auto;
  }

  .nav-tab {
    padding: 0.75rem 1.25rem;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 0.9rem;
    border-radius: 6px 6px 0 0;
    transition: all 0.2s;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
  }

  .nav-tab:hover {
    color: var(--text-primary);
    background: var(--bg-tertiary);
  }

  .nav-tab.active {
    color: var(--accent-blue);
    background: var(--bg-primary);
    border-bottom-color: var(--accent-blue);
  }

  /* Main Layout */
  .main-container {
    display: flex;
    height: calc(100vh - 120px);
    min-height: 600px;
  }

  .canvas-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: 
      radial-gradient(circle at 20% 50%, rgba(88,166,255,0.03) 0%, transparent 50%),
      radial-gradient(circle at 80% 50%, rgba(63,185,80,0.03) 0%, transparent 50%),
      var(--bg-primary);
  }

  .canvas-area::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(48,54,61,0.3) 1px, transparent 1px),
      linear-gradient(90deg, rgba(48,54,61,0.3) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .side-panel {
    width: 400px;
    min-width: 350px;
    background: var(--bg-secondary);
    border-left: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-tabs {
    display: flex;
    border-bottom: 1px solid var(--border-color);
  }

  .panel-tab {
    flex: 1;
    padding: 0.75rem;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
  }

  .panel-tab:hover { color: var(--text-primary); }
  .panel-tab.active {
    color: var(--accent-blue);
    background: var(--bg-tertiary);
  }

  .panel-content {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
  }

  /* Topology Canvas */
  #topologyCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Simulation Controls */
  .sim-controls {
    position: absolute;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.5rem;
    background: var(--bg-secondary);
    padding: 0.75rem 1.5rem;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 20px var(--shadow);
  }

  .ctrl-btn {
    padding: 0.6rem 1.2rem;
    border: 1px solid var(--border-color);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .ctrl-btn:hover {
    background: var(--bg-card);
    border-color: var(--accent-blue);
    transform: translateY(-1px);
  }

  .ctrl-btn:active { transform: translateY(0); }

  .ctrl-btn.primary {
    background: var(--accent-blue);
    color: #fff;
    border-color: var(--accent-blue);
  }

  .ctrl-btn.primary:hover {
    background: #79b8ff;
  }

  .ctrl-btn.danger {
    background: var(--accent-red);
    color: #fff;
    border-color: var(--accent-red);
  }

  .speed-control {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-left: 0.5rem;
    padding-left: 0.75rem;
    border-left: 1px solid var(--border-color);
  }

  .speed-control label {
    font-size: 0.75rem;
    color: var(--text-secondary);
  }

  .speed-control input[type="range"] {
    width: 80px;
    accent-color: var(--accent-blue);
  }

  /* Topology Selector */
  .topology-selector {
    position: absolute;
    top: 1rem;
    left: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    background: var(--bg-secondary);
    padding: 0.75rem;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 20px var(--shadow);
  }

  .topology-selector-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
    margin-bottom: 0.25rem;
  }

  .topo-btn {
    padding: 0.5rem 1rem;
    border: 1px solid var(--border-color);
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
    text-align: left;
  }

  .topo-btn:hover {
    background: var(--bg-card);
    color: var(--text-primary);
  }

  .topo-btn.active {
    background: var(--accent-blue);
    color: #fff;
    border-color: var(--accent-blue);
  }

  /* Step Indicator */
  .step-indicator {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: var(--bg-secondary);
    padding: 0.75rem 1rem;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  .step-indicator .step-num {
    color: var(--accent-blue);
    font-weight: bold;
  }

  /* Info Panel Cards */
  .info-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 0.75rem;
  }

  .info-card h3 {
    font-size: 0.95rem;
    color: var(--accent-blue);
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .info-card p, .info-card li {
    font-size: 0.85rem;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .info-card ul {
    padding-left: 1.2rem;
  }

  .info-card li { margin-bottom: 0.25rem; }

  .tag {
    display: inline-block;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .tag-blue { background: rgba(88,166,255,0.15); color: var(--accent-blue); }
  .tag-green { background: rgba(63,185,80,0.15); color: var(--accent-green); }
  .tag-orange { background: rgba(240,136,62,0.15); color: var(--accent-orange); }
  .tag-red { background: rgba(248,81,73,0.15); color: var(--accent-red); }
  .tag-purple { background: rgba(163,113,247,0.15); color: var(--accent-purple); }

  /* Packet Inspector */
  .packet-inspector {
    font-family: 'Courier New', monospace;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 0.75rem;
    font-size: 0.75rem;
    overflow-x: auto;
  }

  .packet-line {
    padding: 0.15rem 0;
    color: var(--text-secondary);
  }

  .packet-line .field { color: var(--accent-blue); }
  .packet-line .value { color: var(--accent-green); }
  .packet-line .hex { color: var(--accent-purple); }

  /* CLI Terminal */
  .cli-terminal {
    background: #000;
    border-radius: 8px;
    padding: 1rem;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    color: #0f0;
    height: 300px;
    overflow-y: auto;
    border: 1px solid #333;
  }

  .cli-terminal .prompt {
    color: var(--accent-green);
  }

  .cli-terminal .cmd {
    color: #fff;
  }

  .cli-terminal .output {
    color: #aaa;
  }

  .cli-terminal .error {
    color: var(--accent-red);
  }

  .cli-input-line {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .cli-input {
    background: transparent;
    border: none;
    color: #0f0;
    font-family: inherit;
    font-size: inherit;
    flex: 1;
    outline: none;
  }

  .cli-cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: #0f0;
    animation: blink 1s infinite;
    vertical-align: middle;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  /* Device Legend */
  .device-legend {
    position: absolute;
    bottom: 1rem;
    left: 1rem;
    background: var(--bg-secondary);
    padding: 0.75rem;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    font-size: 0.75rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.35rem;
    color: var(--text-secondary);
  }

  .legend-icon {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  /* Status Bar */
  .status-bar {
    position: absolute;
    bottom: 5rem;
    left: 1rem;
    background: var(--bg-secondary);
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    font-size: 0.75rem;
    color: var(--text-secondary);
  }

  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 0.3rem;
  }

  .status-active { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
  .status-paused { background: var(--accent-yellow); }
  .status-stopped { background: var(--accent-red); }

  /* Packet animation overlay */
  .packet-overlay {
    position: absolute;
    pointer-events: none;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .main-container { flex-direction: column; }
    .side-panel { width: 100%; height: 300px; min-width: unset; border-left: none; border-top: 1px solid var(--border-color); }
    .canvas-area { height: 400px; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-secondary); }
  ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

  /* Expandable section */
  .expandable {
    border: 1px solid var(--border-color);
    border-radius: 8px;
    margin-bottom: 0.5rem;
    overflow: hidden;
  }

  .expandable-header {
    padding: 0.6rem 0.75rem;
    background: var(--bg-tertiary);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: var(--text-primary);
    transition: background 0.2s;
  }

  .expandable-header:hover { background: var(--bg-card); }

  .expandable-body {
    padding: 0.75rem;
    font-size: 0.8rem;
    color: var(--text-secondary);
    line-height: 1.6;
    display: none;
  }

  .expandable.expanded .expandable-body { display: block; }
  .expandable.expanded .expand-arrow { transform: rotate(180deg); }

  .expand-arrow {
    transition: transform 0.2s;
    font-size: 0.7rem;
  }

  /* Tooltip */
  .tooltip {
    position: absolute;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 0.75rem;
    font-size: 0.8rem;
    color: var(--text-primary);
    pointer-events: none;
    z-index: 50;
    max-width: 250px;
    box-shadow: 0 4px 20px var(--shadow);
    display: none;
  }

  .tooltip-title {
    font-weight: 600;
    color: var(--accent-blue);
    margin-bottom: 0.25rem;
  }

  .tooltip-detail {
    color: var(--text-secondary);
    font-size: 0.75rem;
  }

  /* Table Styles */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
    margin: 0.5rem 0;
  }

  th, td {
    padding: 0.4rem 0.5rem;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
  }

  th {
    color: var(--accent-blue);
    font-weight: 600;
    background: var(--bg-tertiary);
  }

  td { color: var(--text-secondary); }

  /* Highlight effect */
  .highlight-box {
    background: rgba(88,166,255,0.08);
    border-left: 3px solid var(--accent-blue);
    padding: 0.5rem 0.75rem;
    border-radius: 0 6px 6px 0;
    margin: 0.5rem 0;
    font-size: 0.8rem;
    color: var(--text-secondary);
  }

  .highlight-box.green {
    background: rgba(63,185,80,0.08);
    border-left-color: var(--accent-green);
  }

  .highlight-box.orange {
    background: rgba(240,136,62,0.08);
    border-left-color: var(--accent-orange);
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Network Topology</h1>
    <div class="header-subtitle">Interactive Learning Lab — CCIE Network Architect Series</div>
  </div>
  <div style="display:flex;align-items:center;gap:1rem;">
    <span class="tag tag-blue">CCNA</span>
    <span class="tag tag-purple">CCNP</span>
    <span class="tag tag-green">Interactive</span>
  </div>
</div>

<div class="nav-tabs">
  <button class="nav-tab active" data-tab="visual">Visual Topology</button>
  <button class="nav-tab" data-tab="packet">Packet Flow</button>
  <button class="nav-tab" data-tab="cli">Cisco CLI Sim</button>
  <button class="nav-tab" data-tab="compare">Topology Compare</button>
  <button class="nav-tab" data-tab="quiz">Quick Quiz</button>
</div>

<div class="main-container">
  <div class="canvas-area" id="canvasArea">
    <canvas id="topologyCanvas"></canvas>
    
    <div class="topology-selector">
      <div class="topology-selector-title">Select Topology</div>
      <button class="topo-btn active" data-topo="star">Star</button>
      <button class="topo-btn" data-topo="bus">Bus</button>
      <button class="topo-btn" data-topo="ring">Ring</button>
      <button class="topo-btn" data-topo="mesh">Mesh</button>
      <button class="topo-btn" data-topo="tree">Tree</button>
      <button class="topo-btn" data-topo="leafspine">Leaf-Spine</button>
      <button class="topo-btn" data-topo="hubspoke">Hub-and-Spoke</button>
    </div>

    <div class="step-indicator" id="stepIndicator" style="display:none;">
      Step <span class="step-num" id="currentStep">0</span> / <span id="totalSteps">0</span>
    </div>

    <div class="status-bar" id="statusBar">
      <span class="status-dot status-stopped" id="statusDot"></span>
      <span id="statusText">Ready</span>
    </div>

    <div class="device-legend" id="deviceLegend">
      <div class="legend-item"><span class="legend-icon" style="background:var(--device-router)"></span> Router</div>
      <div class="legend-item"><span class="legend-icon" style="background:var(--device-switch)"></span> Switch</div>
      <div class="legend-item"><span class="legend-icon" style="background:var(--device-pc)"></span> PC/Host</div>
      <div class="legend-item"><span class="legend-icon" style="background:var(--device-server)"></span> Server</div>
    </div>

    <div class="sim-controls" id="simControls">
      <button class="ctrl-btn primary" id="btnStart">▶ Start</button>
      <button class="ctrl-btn" id="btnPause">⏸ Pause</button>
      <button class="ctrl-btn danger" id="btnReset">↺ Reset</button>
      <button class="ctrl-btn" id="btnStep">→ Step</button>
      <div class="speed-control">
        <label>Speed</label>
        <input type="range" id="speedRange" min="1" max="5" value="3">
      </div>
    </div>

    <div class="tooltip" id="tooltip"></div>
  </div>

  <div class="side-panel">
    <div class="panel-tabs">
      <button class="panel-tab active" data-panel="info">Info</button>
      <button class="panel-tab" data-panel="packets">Packets</button>
      <button class="panel-tab" data-panel="commands">Commands</button>
      <button class="panel-tab" data-panel="details">Details</button>
    </div>

    <div class="panel-content" id="panelInfo">
      <!-- Dynamic content -->
    </div>
  </div>
</div>

<script>
// ======================
// DATA & CONFIGURATION
// ======================

const topologyData = {
  star: {
    name: "Star Topology",
    description: "All devices connect to a central switch. Each device has a dedicated point-to-point link to the center.",
    devices: [
      { id: "sw1", type: "switch", label: "Switch", x: 0.5, y: 0.5 },
      { id: "pc1", type: "pc", label: "PC-1", x: 0.2, y: 0.2 },
      { id: "pc2", type: "pc", label: "PC-2", x: 0.8, y: 0.2 },
      { id: "pc3", type: "pc", label: "PC-3", x: 0.8, y: 0.8 },
      { id: "srv1", type: "server", label: "Server", x: 0.2, y: 0.8 }
    ],
    links: [
      { from: "pc1", to: "sw1" },
      { from: "pc2", to: "sw1" },
      { from: "pc3", to: "sw1" },
      { from: "srv1", to: "sw1" }
    ],
    pros: ["Easy to install and manage", "Fault isolation — one link failure affects only one device", "Adding/removing devices doesn't disrupt network", "Modern switches provide full-duplex, collision-free operation"],
    cons: ["Central switch is single point of failure", "More cabling than bus topology", "Cable length limited to 100m for UTP"],
    ccna: "Star is the most common physical topology in modern networks. Remember: hub = logical bus, switch = true star.",
    steps: [
      "PC-1 wants to send data to Server. It encapsulates the frame with Destination MAC = Server's MAC.",
      "Frame travels along the dedicated UTP cable from PC-1 to the Switch on Port 1.",
      "Switch receives the frame and inspects the Destination MAC address.",
      "Switch looks up the MAC in its CAM table. If found, forwards only to the destination port.",
      "If MAC is unknown, Switch floods the frame to all ports except the incoming port.",
      "Server receives the frame, recognizes its MAC, and processes the data.",
      "Other devices (PC-2, PC-3) discard the frame as it's not addressed to them."
    ]
  },
  bus: {
    name: "Bus Topology",
    description: "All devices connect to a single shared backbone cable. Data travels in both directions.",
    devices: [
      { id: "bus", type: "bus", label: "Backbone", x: 0.5, y: 0.5 },
      { id: "t1", type: "pc", label: "PC-A", x: 0.15, y: 0.35 },
      { id: "t2", type: "pc", label: "PC-B", x: 0.35, y: 0.65 },
      { id: "t3", type: "server", label: "Server", x: 0.55, y: 0.35 },
      { id: "t4", type: "pc", label: "PC-C", x: 0.75, y: 0.65 },
      { id: "t5", type: "pc", label: "PC-D", x: 0.9, y: 0.35 }
    ],
    links: [
      { from: "t1", to: "bus", anchor: "top" },
      { from: "t2", to: "bus", anchor: "bottom" },
      { from: "t3", to: "bus", anchor: "top" },
      { from: "t4", to: "bus", anchor: "bottom" },
      { from: "t5", to: "bus", anchor: "top" }
    ],
    pros: ["Minimal cabling required", "Simple to understand and install", "Inexpensive for very small networks"],
    cons: ["Single point of failure (backbone cable)", "Difficult to troubleshoot cable faults", "Collisions reduce performance as nodes increase", "Adding/removing devices disrupts entire network"],
    ccna: "Bus topology uses coaxial cable (10BASE2=185m, 10BASE5=500m). Terminators (50 ohm) required at both ends. CSMA/CD handles collisions.",
    steps: [
      "PC-A wants to send data to PC-C. It first listens to the shared backbone (carrier sense).",
      "If the backbone is idle, PC-A transmits the frame. Signal propagates in BOTH directions.",
      "All connected devices (PC-B, Server, PC-C, PC-D) receive the electrical signal.",
      "Each device checks the Destination MAC address in the received frame.",
      "Only PC-C recognizes its MAC address and processes the frame. Others discard it silently.",
      "If two devices transmit simultaneously, a collision is detected (CSMA/CD).",
      "Both devices send a jam signal, wait a random backoff time, and retry transmission."
    ]
  },

const deviceColors = {
  router: '#f0883e',
  switch: '#58a6ff',
  pc: '#3fb950',
  server: '#a371f7',
  bus: '#d29922'
};

// ======================
// STATE
// ======================

let currentTopology = 'star';
let simulationRunning = false;
let simulationPaused = false;
let currentStep = 0;
let animationFrame = null;
let packets = [];
let speed = 3;
let hoveredDevice = null;
let selectedDevice = null;
let activeTab = 'visual';
let activePanel = 'info';

const canvas = document.getElementById('topologyCanvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

// ======================
// CANVAS SETUP
// ======================

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  drawTopology();
}

window.addEventListener('resize', resizeCanvas);

// ======================
// DRAWING FUNCTIONS
// ======================

function drawDevice(device, highlight = false) {
  const x = device.x * canvas.width;
  const y = device.y * canvas.height;
  const size = Math.min(canvas.width, canvas.height) * 0.07;

  ctx.save();
  
  if (highlight || hoveredDevice === device.id) {
    ctx.shadowColor = deviceColors[device.type] || '#58a6ff';
    ctx.shadowBlur = 20;
  }

  if (selectedDevice === device.id) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, size * 0.65, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.fillStyle = deviceColors[device.type] || '#58a6ff';
  ctx.strokeStyle = highlight ? '#fff' : 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 2;

  const iconFn = deviceIcons[device.type] || deviceIcons.switch;
  iconFn(ctx, x, y, size);

  ctx.shadowBlur = 0;

  // Label
  ctx.fillStyle = '#c9d1d9';
  ctx.font = `600 ${Math.max(10, size * 0.16)}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(device.label, x, y + size * 0.65);

  // Type label below
  ctx.fillStyle = '#8b949e';
  ctx.font = `${Math.max(8, size * 0.12)}px 'Segoe UI', sans-serif`;
  ctx.fillText(device.type.toUpperCase(), x, y + size * 0.85);

  ctx.restore();
}

function drawLink(link, devices, highlight = false) {
  const fromDev = devices.find(d => d.id === link.from);
  const toDev = devices.find(d => d.id === link.to);
  if (!fromDev || !toDev) return;

  const x1 = fromDev.x * canvas.width;
  const y1 = fromDev.y * canvas.height;
  const x2 = toDev.x * canvas.width;
  const y2 = toDev.y * canvas.height;

  ctx.save();
  ctx.strokeStyle = highlight ? 'rgba(63,185,80,0.8)' : 'rgba(48,54,61,0.8)';
  ctx.lineWidth = highlight ? 3 : 2;
  
  if (highlight) {
    ctx.shadowColor = 'rgba(63,185,80,0.5)';
    ctx.shadowBlur = 10;
  }

  if (link.anchor === 'bottom') {
    // Draw from device bottom to bus top
    const midY = (y1 + y2) / 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1 + 20);
    ctx.lineTo(x1, midY);
    ctx.lineTo(x2, midY);
    ctx.lineTo(x2, y2 - 15);
    ctx.stroke();
  } else if (link.anchor === 'top') {
    const midY = (y1 + y2) / 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1 - 20);
    ctx.lineTo(x1, midY);
    ctx.lineTo(x2, midY);
    ctx.lineTo(x2, y2 + 15);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawPacket(packet) {
  ctx.save();
  ctx.fillStyle = '#f0883e';
  ctx.shadowColor = '#f0883e';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(packet.x, packet.y, 6, 0, Math.PI * 2);
  ctx.fill();
  
  // Packet trail
  ctx.fillStyle = 'rgba(240,136,62,0.3)';
  ctx.beginPath();
  ctx.arc(packet.x - packet.vx * 3, packet.y - packet.vy * 3, 4, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();
}

function drawTopology() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const topo = topologyData[currentTopology];
  if (!topo) return;

  // Draw links first
  topo.links.forEach(link => {
    const isHighlighted = packets.some(p => p.from === link.from && p.to === link.to);
    drawLink(link, topo.devices, isHighlighted);
  });

  // Draw devices
  topo.devices.forEach(dev => {
    drawDevice(dev, hoveredDevice === dev.id);
  });

  // Draw packets
  packets.forEach(p => drawPacket(p));
}

// ======================
// ANIMATION
// ======================

function animate() {
  if (!simulationRunning || simulationPaused) {
    animationFrame = requestAnimationFrame(animate);
    return;
  }

  const topo = topologyData[currentTopology];
  const speedMult = speed * 0.8;

  packets = packets.filter(p => {
    const toDev = topo.devices.find(d => d.id === p.to);
    if (!toDev) return false;

    const tx = toDev.x * canvas.width;
    const ty = toDev.y * canvas.height;
    const dx = tx - p.x;
    const dy = ty - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 10) {
      // Packet arrived — trigger next step
      if (currentStep < topo.steps.length - 1) {
        currentStep++;
        updateStepDisplay();
        spawnPacketForStep();
      }
      return false;
    }

    p.x += (dx / dist) * speedMult;
    p.y += (dy / dist) * speedMult;
    p.vx = (dx / dist) * speedMult;
    p.vy = (dy / dist) * speedMult;
    return true;
  });

  if (packets.length === 0 && currentStep >= topo.steps.length - 1) {
    simulationRunning = false;
    updateStatus('completed');
  }

  drawTopology();
  animationFrame = requestAnimationFrame(animate);
}

function spawnPacketForStep() {
  const topo = topologyData[currentTopology];
  const devices = topo.devices;
  
  // Determine source and destination based on step
  const step = currentStep;
  let from, to;

  switch(currentTopology) {
    case 'star':
      if (step === 0) { from = 'pc1'; to = 'sw1'; }
      else if (step <= 4) { from = 'sw1'; to = 'srv1'; }
      else { from = 'srv1'; to = 'srv1'; }
      break;
    case 'bus':
      if (step === 0) { from = 't1'; to = 'bus'; }
      else if (step <= 3) { from = 'bus'; to = 't3'; }
      else { from = 't3'; to = 't3'; }
      break;
    case 'ring':
      if (step === 0) { from = 'n1'; to = 'n1'; }
      else if (step <= 3) { from = 'n1'; to = 'n3'; }
      else { from = 'n3'; to = 'n1'; }
      break;
    case 'mesh':
      if (step <= 2) { from = 'm1'; to = 'm5'; }
      else { from = 'm5'; to = 'm3'; }
      break;
    case 'tree':
      if (step === 0) { from = 'h1'; to = 'a1'; }
      else if (step === 1) { from = 'a1'; to = 'd1'; }
      else if (step === 2) { from = 'd1'; to = 'core'; }
      else if (step === 3) { from = 'core'; to = 'd2'; }
      else if (step === 4) { from = 'd2'; to = 'a4'; }
      else { from = 'a4'; to = 'h2'; }
      break;
    case 'leafspine':
      if (step === 0) { from = 'sv1'; to = 'lf1'; }
      else if (step <= 3) { from = 'lf1'; to = 'sp1'; }
      else if (step <= 5) { from = 'sp1'; to = 'lf3'; }
      else { from = 'lf3'; to = 'sv3'; }
      break;
    case 'hubspoke':
      if (step === 0) { from = 'l1'; to = 's1'; }
      else if (step <= 2) { from = 's1'; to = 'hub'; }
      else if (step <= 4) { from = 'hub'; to = 's4'; }
      else { from = 's4'; to = 'l4'; }
      break;
  }

  const fromDev = devices.find(d => d.id === from);
  if (fromDev && to) {
    packets.push({
      x: fromDev.x * canvas.width,
      y: fromDev.y * canvas.height,
      vx: 0, vy: 0,
      from, to
    });
  }
}

// ======================
// UI UPDATES
// ======================

function updateStepDisplay() {
  const topo = topologyData[currentTopology];
  document.getElementById('currentStep').textContent = currentStep + 1;
  document.getElementById('totalSteps').textContent = topo.steps.length;
  document.getElementById('stepIndicator').style.display = 'flex';
  updatePanelContent();
}

function updateStatus(state) {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.className = 'status-dot';
  
  switch(state) {
    case 'running':
      dot.classList.add('status-active');
      text.textContent = 'Simulation Running';
      break;
    case 'paused':
      dot.classList.add('status-paused');
      text.textContent = 'Paused';
      break;
    case 'completed':
      dot.classList.add('status-active');
      text.textContent = 'Completed';
      break;
    default:
      dot.classList.add('status-stopped');
      text.textContent = 'Ready';
  }
}

function updatePanelContent() {
  const topo = topologyData[currentTopology];
  const panel = document.getElementById('panelInfo');

  if (activePanel === 'info') {
    let stepsHtml = '';
    topo.steps.forEach((step, i) => {
      const isActive = i === currentStep;
      const isPast = i < currentStep;
      stepsHtml += `
        <div style="padding:0.5rem 0.75rem;margin-bottom:0.3rem;border-radius:6px;font-size:0.8rem;
          ${isActive ? 'background:rgba(88,166,255,0.1);border-left:3px solid var(--accent-blue);color:var(--text-primary);' : 
            isPast ? 'color:#555;border-left:3px solid var(--accent-green);' : 
            'color:var(--text-secondary);border-left:3px solid var(--border-color);'}">
          <strong style="color:${isActive ? 'var(--accent-blue)' : isPast ? 'var(--accent-green)' : 'var(--text-secondary)'};">Step ${i+1}:</strong> ${step}
        </div>
      `;
    });

    panel.innerHTML = `

// EVENT HANDLERS
// ======================

// Topology selector
document.querySelectorAll('.topo-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.topo-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTopology = btn.dataset.topo;
    resetSimulation();
    updatePanelContent();
    drawTopology();
  });
});

// Simulation controls
document.getElementById('btnStart').addEventListener('click', () => {
  if (!simulationRunning) {
    simulationRunning = true;
    simulationPaused = false;
    currentStep = 0;
    updateStepDisplay();
    spawnPacketForStep();
    updateStatus('running');
  } else if (simulationPaused) {
    simulationPaused = false;
    updateStatus('running');
  }
});

document.getElementById('btnPause').addEventListener('click', () => {
  simulationPaused = true;
  updateStatus('paused');
});

document.getElementById('btnReset').addEventListener('click', resetSimulation);

document.getElementById('btnStep').addEventListener('click', () => {
  const topo = topologyData[currentTopology];
  if (currentStep < topo.steps.length - 1) {
    currentStep++;
    updateStepDisplay();
    spawnPacketForStep();
  }
});

document.getElementById('speedRange').addEventListener('input', (e) => {
  speed = parseInt(e.target.value);
});

function resetSimulation() {
  simulationRunning = false;
  simulationPaused = false;
  currentStep = 0;
  packets = [];
  updateStatus('stopped');
  document.getElementById('stepIndicator').style.display = 'none';
  updatePanelContent();
  drawTopology();
}

// Canvas interactions
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  
  const topo = topologyData[currentTopology];
  let found = null;
  
  topo.devices.forEach(dev => {
    const dx = mx - dev.x * canvas.width;
    const dy = my - dev.y * canvas.height;
    if (Math.sqrt(dx*dx + dy*dy) < 40) {
      found = dev.id;
    }
  });
  
  hoveredDevice = found;
  canvas.style.cursor = found ? 'pointer' : 'default';
  
  if (found) {
    const dev = topo.devices.find(d => d.id === found);
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 15) + 'px';
    tooltip.style.top = (e.clientY + 15) + 'px';
    tooltip.innerHTML = `
      <div class="tooltip-title">${dev.label}</div>
      <div class="tooltip-detail">Type: ${dev.type.toUpperCase()}<br>
      Position: (${Math.round(dev.x*100)}%, ${Math.round(dev.y*100)}%)<br>
      Click to select</div>
    `;
  } else {
    tooltip.style.display = 'none';
  }
  
  drawTopology();
});

canvas.addEventListener('click', (e) => {
  if (hoveredDevice) {
    selectedDevice = selectedDevice === hoveredDevice ? null : hoveredDevice;
    drawTopology();
  }
});

canvas.addEventListener('mouseleave', () => {
  hoveredDevice = null;
  tooltip.style.display = 'none';
  drawTopology();
});

function handleTabSwitch() {
  const canvasArea = document.getElementById('canvasArea');
  const panel = document.querySelector('.side-panel');
  
  // Remove existing special views
  canvasArea.querySelectorAll('.special-view').forEach(el => el.remove());
  
  if (activeTab === 'visual') {
    document.getElementById('topologyCanvas').style.display = 'block';
    document.getElementById('simControls').style.display = 'flex';
    document.querySelector('.topology-selector').style.display = 'flex';
    document.getElementById('deviceLegend').style.display = 'block';
    panel.style.display = 'flex';
    resizeCanvas();
  } else if (activeTab === 'packet') {
    showPacketFlowView();
    document.getElementById('simControls').style.display = 'none';
    document.querySelector('.topology-selector').style.display = 'none';
    document.getElementById('deviceLegend').style.display = 'none';
    panel.style.display = 'flex';
    activePanel = 'packets';
    updatePanelTabs();
    updatePanelContent();
  } else if (activeTab === 'cli') {
    showCLIView();
    document.getElementById('simControls').style.display = 'none';
    document.querySelector('.topology-selector').style.display = 'none';
    document.getElementById('deviceLegend').style.display = 'none';
    panel.style.display = 'none';
  } else if (activeTab === 'compare') {
    showCompareView();
    document.getElementById('simControls').style.display = 'none';
    document.querySelector('.topology-selector').style.display = 'none';
    document.getElementById('deviceLegend').style.display = 'none';
    panel.style.display = 'none';
  } else if (activeTab === 'quiz') {
    showQuizView();
    document.getElementById('simControls').style.display = 'none';
    document.querySelector('.topology-selector').style.display = 'none';
    document.getElementById('deviceLegend').style.display = 'none';
    panel.style.display = 'none';
  }
}

function updatePanelTabs() {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-panel="${activePanel}"]`)?.classList.add('active');
}

function getLayerName(layer) {
  const names = {7:'Application',6:'Presentation',5:'Session',4:'Transport',3:'Network',2:'Data Link',1:'Physical'};
  return names[layer];
}

function getLayerAction(layer) {
  const actions = {
    7: 'HTTP request generated by browser',
    6: 'Data formatting and encryption (TLS)',
    5: 'Session establishment and management',
    4: 'TCP segmentation, port numbers added',
    3: 'IP addressing, routing decision made',
    2: 'MAC addressing, frame creation, FCS',
    1: 'Electrical/optical signals on medium'
  };
  return actions[layer];
}

    function getPrompt() {

      if (mode === 'config') return `${hostname}(config)#`;
      if (mode === 'privileged') return `${hostname}#`;
      return `${hostname}>`;
    }
    
    function processCommand(cmd) {
      const parts = cmd.trim().split(/\s+/);
      const base = parts[0]?.toLowerCase();
      
      if (!base) return '';
      
      // Mode checks
      if ((base === 'configure' || base === 'conf' || base === 'conf t') && mode !== 'privileged') {
        return '^\n% Invalid input detected at '^' marker.';
      }
      if (base.startsWith('show') && mode === 'config') {
        return '^{\n% Invalid input detected at '^' marker.\nDo show commands from privileged EXEC mode.';
      }
      
      // Command matching
      if (base === 'enable') {
        if (mode === 'user') { mode = 'privileged'; return ''; }
        return '';
      }
      if (base === 'disable') { mode = 'user'; return ''; }
      if (base === 'conf' || base === 'configure' || cmd.includes('configure terminal') || cmd.includes('conf t')) {
        if (mode === 'privileged') { mode = 'config'; return 'Enter configuration commands, one per line. End with CNTL/Z.'; }
        return '% Command rejected.';
      }
      if (base === 'end') { mode = 'privileged'; return ''; }
      if (base === 'exit') {
        if (mode === 'config-if') mode = 'config';
        else if (mode === 'config') mode = 'privileged';
        else if (mode === 'privileged') mode = 'user';
        return '';
      }
      if (base === 'hostname' && parts[1] && mode === 'config') {
        hostname = parts[1];
        return '';
      }
      if ((base === 'interface' || base === 'int') && mode === 'config') {
        mode = 'config-if';
        return '';
      }
      if (base === 'ping' && parts[1]) {
        return `Type escape sequence to abort.\nSending 5, 100-byte ICMP Echos to ${parts[1]}, timeout is 2 seconds:\n!!!!!\nSuccess rate is 100 percent (5/5), round-trip min/avg/max = 1/2/4 ms`;
      }
      if (base === 'traceroute' && parts[1]) {
        return `Type escape sequence to abort.\nTracing the route to ${parts[1]}\n\n  1 192.168.1.1 2 msec 1 msec 1 msec\n  2 10.0.0.2 4 msec 3 msec 4 msec\n  3 ${parts[1]} 5 msec *  4 msec`;
      }
      if (base === 'write' || base === 'wr') {
        return 'Building configuration...\n[OK]';
      }
      if (base === 'clear' && parts[1] === 'mac' && parts[2] === 'address-table') {
        return 'Dynamic entries cleared.';
      }
      
      // Check show commands
      const fullCmd = parts.slice(0, 3).join(' ');
      if (commandResponses[cmd]) return commandResponses[cmd]();
      if (commandResponses[fullCmd]) return commandResponses[fullCmd]();
      if (base === 'show') {
        const showCmd = parts.slice(0, 3).join(' ');
        if (commandResponses[showCmd]) return commandResponses[showCmd]();
      }
      
      // Help
      if (cmd.includes('?')) {
        return '  enable    Turn on privileged commands\n  disable   Turn off privileged commands\n  show      Show running system information\n  configure Enter configuration mode\n  ping      Send echo messages\n  traceroute Trace route to destination\n  exit      Exit from the EXEC';
      }
      
      return `% Unknown command or computer name, or unable to find computer address\n'${cmd}'`;
    }
    
    input?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const cmd = input.value;
        input.value = '';
        
        // Remove cursor line
        const cursorLine = terminal.querySelector('.cli-input-line');
        
        // Add command to output
        const cmdDiv = document.createElement('div');
        cmdDiv.innerHTML = `<span class="prompt">${getPrompt()}</span> <span class="cmd">${cmd}</span>`;
        terminal.insertBefore(cmdDiv, cursorLine);
        
        // Process and show response
        const response = processCommand(cmd);
        if (response) {
          response.split('\\n').forEach(line => {
            const outDiv = document.createElement('div');
            outDiv.className = 'output';
            outDiv.textContent = line;
            terminal.insertBefore(outDiv, cursorLine);
          });
        }
        
        // Update prompt
        cursorLine.querySelector('.prompt').textContent = getPrompt();
        
        // Scroll to bottom
        terminal.scrollTop = terminal.scrollHeight;
      }
    });
    
    input?.focus();
  }, 100);
}

    <div class="info-card" style="max-width:600px;">
      <h3 style="color:var(--text-primary);margin-bottom:1rem;font-size:1rem;">${q.q}</h3>
      <div id="quizOptions" style="display:flex;flex-direction:column;gap:0.5rem;">
        ${q.options.map((opt, i) => `
          <button class="quiz-option" data-index="${i}" style="
            padding:0.75rem 1rem;
            background:var(--bg-tertiary);
            border:1px solid var(--border-color);
            border-radius:8px;
            color:var(--text-primary);
            cursor:pointer;
            text-align:left;
            font-size:0.9rem;
            transition:all 0.2s;
          " onmouseover="this.style.borderColor='var(--accent-blue)'" onmouseout="this.style.borderColor='var(--border-color)'">
            <strong style="color:var(--accent-blue);margin-right:0.5rem;">${String.fromCharCode(65+i)}.</strong> ${opt}
          </button>
        `).join('')}
      </div>
      <div id="quizFeedback" style="margin-top:1rem;display:none;"></div>
    </div>
    
    <div style="margin-top:1.5rem;display:flex;gap:0.5rem;">
      <button id="quizNext" style="
        padding:0.6rem 1.5rem;
        background:var(--accent-blue);
        color:#fff;
        border:none;
        border-radius:8px;
        cursor:pointer;
        font-size:0.9rem;
        display:none;
      ">Next Question →</button>
      <button id="quizRestart" style="
        padding:0.6rem 1.5rem;
        background:var(--bg-tertiary);
        color:var(--text-primary);
        border:1px solid var(--border-color);
        border-radius:8px;
        cursor:pointer;
        font-size:0.9rem;
        display:none;
      ">↺ Restart Quiz</button>
    </div>
  `;
  
  answered = false;
  
  container.querySelectorAll('.quiz-option').forEach(btn => {
    btn.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      
      const selected = parseInt(btn.dataset.index);
      const correct = q.correct;
      const feedback = document.getElementById('quizFeedback');
      
      container.querySelectorAll('.quiz-option').forEach((b, i) => {
        b.style.cursor = 'default';
        if (i === correct) {
          b.style.background = 'rgba(63,185,80,0.15)';
          b.style.borderColor = 'var(--accent-green)';
        } else if (i === selected && i !== correct) {
          b.style.background = 'rgba(248,81,73,0.15)';
          b.style.borderColor = 'var(--accent-red)';
        }
      });
      
      if (selected === correct) {
        quizScore++;
        feedback.innerHTML = `<div style="color:var(--accent-green);font-weight:600;">✅ Correct!</div><div style="color:var(--text-secondary);font-size:0.8rem;margin-top:0.3rem;">${q.explanation}</div>`;
      } else {
        feedback.innerHTML = `<div style="color:var(--accent-red);font-weight:600;">❌ Incorrect. The correct answer is ${String.fromCharCode(65+correct)}.</div><div style="color:var(--text-secondary);font-size:0.8rem;margin-top:0.3rem;">${q.explanation}</div>`;
      }
      feedback.style.display = 'block';
      
      // Update score display
      container.querySelector('.info-card').previousElementSibling.textContent = 
        `Question ${currentQuizQuestion + 1} of ${quizQuestions.length} | Score: ${quizScore}/${quizQuestions.length}`;
      
      if (currentQuizQuestion < quizQuestions.length - 1) {
        document.getElementById('quizNext').style.display = 'block';
      } else {
        const restartBtn = document.getElementById('quizRestart');
        restartBtn.style.display = 'block';
        restartBtn.textContent = `🏆 Quiz Complete! Score: ${quizScore}/${quizQuestions.length} — Play Again`;
      }
    });
  });
  
  document.getElementById('quizNext')?.addEventListener('click', () => {
    currentQuizQuestion++;
    renderQuiz(container);
  });
  
  document.getElementById('quizRestart')?.addEventListener('click', () => {
    currentQuizQuestion = 0;
    quizScore = 0;
    renderQuiz(container);
  });
}

// ======================
// INITIALIZATION
// ======================

function init() {
  resizeCanvas();
  updatePanelContent();
  animate();
}

init();
</script>

</body>
</html>
