        g = { key: key, chapter: q.chapterName, topic: q.topicName, subtopic: q.subtopicName,
          name: q.subtopicName || q.topicName, attempts: 0, correct: 0, incorrect: 0, overdue: 0, hard: 0, questions: 0 };
        groups.set(key, g);
      }
      g.questions++;
      g.attempts += r.attempts;
      g.correct += r.correct;
      g.incorrect += r.incorrect;
      if (Progress.isDue(q.id)) g.overdue++;
      if (q.difficulty === 'hard') g.hard++;
    }
    const minAtt = Storage.state.settings.weakMinAttempts;
    const list = [];
    groups.forEach((g) => {
      if (g.attempts < minAtt) return;
      const acc = g.attempts ? g.correct / g.attempts : 0;
      const hardPct = g.questions ? g.hard / g.questions : 0;
      g.accuracy = Math.round(acc * 100);
      g.score = Math.round(((1 - acc) * 60 + Math.min(g.overdue, 20) * 1.6 + Math.min(g.incorrect, 20) * 0.8 + (hardPct > 0.5 ? 5 : 0)) * 10) / 10;
      list.push(g);
    });
    list.sort((a, b) => b.score - a.score);
    return limit ? list.slice(0, limit) : list;
  },
  streak() {
    const act = Storage.state.meta.activity;
    const days = Object.keys(act).filter((d) => act[d] && act[d].attempts > 0).sort();
    if (!days.length) return { current: 0, best: 0 };
    const set = new Set(days);
    const key = (d) => U.todayStr(d);
    const walk = (startKey) => {
      let run = 0;
      const cur = new Date(startKey + 'T12:00:00');
      while (set.has(key(cur))) { run++; cur.setDate(cur.getDate() - 1); }
      return run;
    };
    const today = key(new Date());
    const prevDay = key(new Date(Date.now() - 86400000));
    let current = 0;
    if (set.has(today)) current = walk(today);
    else if (set.has(prevDay)) current = walk(prevDay);
    let best = 0;
    days.forEach((d) => { best = Math.max(best, walk(d)); });
    return { current: current, best: best };
  },
  activitySeries(daysCount) {
    const out = [];
    const set = Storage.state.meta.activity;
    for (let i = daysCount - 1; i >= 0; i--) {
      const d = new Date(Date.now() - i * 86400000);
      const k = U.todayStr(d);
      const a = set[k] || { attempts: 0, correct: 0 };
      out.push({ date: k, day: String(d.getDate()), attempts: a.attempts, correct: a.correct });
    }
    return out;
  }
};

/* ============================================================
   12. UI HELPERS (toasts, modals, navigation, clipboard)
   ============================================================ */
const UI = {
  toasts: [],
  toast(msg, kind) {
    const id = Date.now() + Math.random();
    UI.toasts.push({ id: id, msg: msg, kind: kind || 'info' });
    setTimeout(() => {
      const i = UI.toasts.findIndex((t) => t.id === id);
      if (i !== -1) UI.toasts.splice(i, 1);
    }, 3800);
  },
  confirm(opts) {
    store.modal = {
      title: opts.title || 'Are you sure?',
      body: opts.body || '',
      confirmText: opts.confirmText || 'Confirm',
      cancelText: opts.cancelText || 'Cancel',
      altText: opts.altText || null,
      onAlt: opts.onAlt || null,
      danger: !!opts.danger,
      onConfirm: opts.onConfirm || function () {}
    };
  },
  closeModal() {
    store.modal = null;
  },
  doConfirm() {
    const m = store.modal;
    if (!m) return;
    const fn = m.onConfirm;
    store.modal = null;
    fn();
  },
  go(view, param) {
    store.view = view;
    store.viewParam = param || null;
    store.ui.sidebarOpen = false;
    window.scrollTo(0, 0);
  },
  reload() {
    window.location.reload();
  },
  toggleSidebar(force) {
    store.ui.sidebarOpen = typeof force === 'boolean' ? force : !store.ui.sidebarOpen;
  },
  copy(text, msg) {
    const done = () => UI.toast(msg || 'Copied to clipboard', 'ok');
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { UI.toast('Copy failed — select the text manually', 'err'); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else fallback();
  },
  accClass(acc) {
    return acc >= 80 ? 'ok' : acc >= 60 ? 'warn' : 'bad';
  }
};

</script>

<script>
'use strict';

/* ============================================================
   13. SESSION ENGINE (active-recall practice sessions)
   ============================================================ */
const Session = {
  start(opts) {
    const o = opts || {};
    let pool = Query.apply(o.filters || {});
    if (o.ids) pool = o.ids.map((id) => DataStore.byId[id]).filter(Boolean);
    if (o.shuffle) pool = U.shuffle(pool);
    if (o.cap > 0) pool = pool.slice(0, o.cap);
    if (!pool.length) {
      UI.toast('No questions match the selected criteria', 'warn');
      return false;
    }
    const spec = {
      mode: o.mode || 'review', title: o.title || 'Review',
      filters: o.filters || {}, ids: o.ids || null, cap: o.cap || 0, shuffle: !!o.shuffle
    };
    store.session = Vue.reactive({
      mode: spec.mode, title: spec.title, filterDesc: o.filterDesc || '',
      queue: pool.map((q) => q.id), index: 0,
      revealed: false, userAnswer: '', verdict: null,
      results: [], startedAt: Date.now(), done: false, restartSpec: spec
    });
    store.sessionSummary = null;
    return true;
  },
  current() {
    const s = store.session;
    if (!s || s.done) return null;
    return DataStore.byId[s.queue[s.index]] || null;
  },
  reveal() {
    const s = store.session;
    if (!s || s.done || s.revealed) return;
    const q = Session.current();
    if (!q) return;
    s.revealed = true;
    s.verdict = Evaluator.evaluate(q, s.userAnswer);
    store.ui.hintsVisible = false;
  },
  rate(rating) {
    const s = store.session;
    if (!s || s.done || !s.revealed) return;
    const q = Session.current();
    if (!q) return;
    const ver = s.verdict || Evaluator.evaluate(q, s.userAnswer);
    Progress.recordAttempt(q.id, ver.correct, rating);
    s.results.push({ qid: q.id, correct: ver.correct, rating: rating, score: ver.score });
    if (s.mode === 'random') { RandomMode.roll(); return; }
    if (s.index >= s.queue.length - 1) { Session.finish(); return; }
    s.index++;
    s.revealed = false;
    s.userAnswer = '';
    s.verdict = null;
  },
  next() {
    const s = store.session;
    if (!s || s.done) return;
    if (s.mode === 'random') { RandomMode.roll(); return; }
    if (s.index >= s.queue.length - 1) { Session.finish(); return; }
    s.index++;
    s.revealed = false;
    s.userAnswer = '';
    s.verdict = null;
  },
  finish() {
    const s = store.session;
    if (!s || s.done) return;
    s.done = true;
    const total = s.results.length;
    const correct = s.results.filter((r) => r.correct).length;
    store.sessionSummary = {
      mode: s.mode, title: s.title, total: total, correct: correct,
      accuracy: total ? Math.round((correct / total) * 100) : 0,
      missed: s.results.filter((r) => !r.correct).map((r) => r.qid),
      durationMs: Date.now() - s.startedAt
    };
    if (total) Progress.recordSession(s.mode, total, correct, Date.now() - s.startedAt);
  },
  end() {
    const s = store.session;
    if (s && !s.done && s.results.length) {
      const correct = s.results.filter((r) => r.correct).length;
      Progress.recordSession(s.mode + '-partial', s.results.length, correct, Date.now() - s.startedAt);
    }
    store.session = null;
    store.sessionSummary = null;
  },
  restart() {
    const s = store.session;
    if (!s) return;
    const spec = s.restartSpec;
    Session.end();
    if (spec) Session.start(spec);
  }
};

/* ============================================================
   14. RANDOM MODE (single-question rolling session)
   ============================================================ */
const RandomMode = {
  start(filters) {
    const pool = Query.apply(filters || {});
    if (!pool.length) {
      UI.toast('No questions match the selected options', 'warn');
      return false;
    }
    const q = U.pick(pool);
    store.session = Vue.reactive({
      mode: 'random', title: 'Random Question', filterDesc: '',
      queue: [q.id], index: 0, revealed: false, userAnswer: '', verdict: null,
      results: [], startedAt: Date.now(), done: false,
      restartSpec: { mode: 'random', filters: filters || {}, ids: null, cap: 0, shuffle: false }
    });
    store.sessionSummary = null;
    return true;
  },
  roll() {
    const s = store.session;
    if (!s || s.done) return;
    const spec = s.restartSpec || {};
    const pool = Query.apply(spec.filters || {});
    if (!pool.length) { Session.finish(); return; }
    const q = U.pick(pool);
    s.queue = [q.id];
    s.index = 0;
    s.revealed = false;
    s.userAnswer = '';
    s.verdict = null;
  }
};

/* ============================================================
   15. EXAM ENGINE (timed, closed-book, navigable)
   ============================================================ */
const Exam = {
  start(cfg) {
    const c = cfg || {};
    const pool = Query.apply({
      difficulty: c.difficulty === 'mixed' ? '' : c.difficulty,
      type: c.type === 'all' ? '' : c.type
    });
    if (!pool.length) { UI.toast('No questions match the exam configuration', 'warn'); return false; }
    const picked = U.shuffle(pool).slice(0, c.count || 25);
    if (store.exam && store.exam.timer) clearInterval(store.exam.timer);
    store.exam = Vue.reactive({
      cfg: { count: picked.length, difficulty: c.difficulty || 'mixed', type: c.type || 'all', timeLimit: c.timeLimit || 0 },
      questions: picked,
      current: 0,
      answers: {},
      marked: {},
      elapsed: 0,
      timer: null,
      finished: false
    });
    store.examResults = null;
    Exam.startTimer();
    return true;
  },
  startTimer() {
    if (store.exam.timer) clearInterval(store.exam.timer);
    store.exam.timer = setInterval(() => {
      if (!store.exam || store.exam.finished) { clearInterval(store.exam.timer); return; }
      store.exam.elapsed++;
      const limit = store.exam.cfg.timeLimit;
      if (limit > 0 && store.exam.elapsed >= limit * 60) Exam.submit(true);
    }, 1000);
  },
  current() {
    return store.exam ? store.exam.questions[store.exam.current] : null;
  },
  go(i) {
    if (store.exam && i >= 0 && i < store.exam.questions.length) store.exam.current = i;
  },
  next() { Exam.go(store.exam.current + 1); },
  prev() { Exam.go(store.exam.current - 1); },
  answeredCount() {
    return store.exam ? Object.keys(store.exam.answers).length : 0;
  },
  submit(auto) {
    const ex = store.exam;
    if (!ex || ex.finished) return;
    if (ex.timer) clearInterval(ex.timer);
    ex.finished = true;
    ex.auto = !!auto;
    const results = [];
    let correct = 0;
    for (const q of ex.questions) {
      const val = ex.answers[q.id] || '';
      const ver = Evaluator.evaluate(q, val);
      if (ver.correct) correct++;
      Progress.recordAttempt(q.id, ver.correct, null);
      results.push({ q: q, user: val, verdict: ver });
    }
    const groups = {};
    results.forEach((r) => {
      const k = r.q.topicName;
      if (!groups[k]) groups[k] = { name: k, correct: 0, total: 0 };
      groups[k].total++;
      if (r.verdict.correct) groups[k].correct++;
    });
    const weakAreas = Object.keys(groups)
      .map((k) => ({ name: k, accuracy: Math.round((groups[k].correct / groups[k].total) * 100) }))
      .filter((g) => g.accuracy < 80)
      .sort((a, b) => a.accuracy - b.accuracy)
      .slice(0, 5);
    store.examResults = {
      total: ex.questions.length,
      correct: correct,
      incorrect: ex.questions.length - correct,
      score: Math.round((correct / ex.questions.length) * 100),
      weakAreas: weakAreas,
      results: results,
      elapsed: ex.elapsed
    };
    Progress.recordSession('exam', ex.questions.length, correct, ex.elapsed * 1000);
    if (auto) UI.toast('Time is up — exam submitted automatically', 'warn');
  },
  reset() {
    if (store.exam && store.exam.timer) clearInterval(store.exam.timer);
    store.exam = null;
    store.examResults = null;
  }
};

const TroubleFocus = [
  { id: 'all', name: 'All Troubleshooting', tags: [] },
  { id: 'vlan', name: 'VLANs', tags: ['vlan'] },
  { id: 'trunk', name: 'Trunk / Native VLAN', tags: ['trunk', 'native-vlan'] },
  { id: 'etherchannel', name: 'EtherChannel', tags: ['etherchannel'] },
  { id: 'stp', name: 'STP', tags: ['stp'] },
  { id: 'hsrp', name: 'HSRP', tags: ['hsrp'] },
  { id: 'dhcp', name: 'DHCP', tags: ['dhcp'] },
  { id: 'routing', name: 'Routing', tags: ['routing', 'static', 'route-selection'] },
  { id: 'ospf', name: 'OSPF', tags: ['ospf'] },
  { id: 'eigrp', name: 'EIGRP', tags: ['eigrp'] },
  { id: 'acl', name: 'ACLs', tags: ['acl'] }
];
const Trouble = {
  match(q, focusId) {
    const f = TroubleFocus.find((x) => x.id === focusId) || TroubleFocus[0];
    if (q.type !== 'troubleshooting') return false;
    if (f.id === 'all') return true;
    return q.tags.some((t) => f.tags.indexOf(t) !== -1);
  },
  pool(focusId) {
    return DataStore.questions.filter((q) => Trouble.match(q, focusId));
  },
  start(focusId) {
    const pool = Trouble.pool(focusId);
    if (!pool.length) { UI.toast('No troubleshooting questions in this focus area yet', 'warn'); return false; }
    const f = TroubleFocus.find((x) => x.id === focusId) || TroubleFocus[0];
    return Session.start({
      mode: 'trouble', title: 'Troubleshooting — ' + f.name, filterDesc: f.name,
      ids: pool.map((q) => q.id), shuffle: true, cap: 0
    });
  }
};

    text: { type: [String, Array], default: '' },
    title: { type: String, default: 'terminal' },

  },

    lines() {
      const raw = Array.isArray(this.text) ? this.text.join('\n') : String(this.text || '');
      const arr = raw.split(/\r?\n/).filter((l) => l.trim() !== '');
      if (!arr.length) arr.push('');

    rawText() {
      const raw = Array.isArray(this.text) ? this.text.join('\n') : String(this.text || '');

    }
  },

    copy() { G.UI.copy(this.rawText); }
  },

    '<div class="terminal">' +
      '<div class="terminal-head">' +

const TopicsView = {
  name: 'TopicsView',
  data() {
    return {
      scope: 'chapter',
      filters: { type: '', difficulty: '' },
      cap: 0,
      shuffle: true
    };
  },
  computed: {
    chapter() {
      return G.DataStore.chapters.find((c) => c.chapter.id === G.store.viewParam) || null;
    },
    chapterCount() {
      if (!this.chapter) return 0;
      let n = 0;
      this.chapter.topics.forEach((t) => t.subtopics.forEach((s) => { n += s.questions.length; }));
      return n;
    },
    scopeOptions() {
      const opts = [];
      if (!this.chapter) return opts;
      opts.push({ value: 'chapter', label: this.chapter.chapter.name + ' — all (' + this.chapterCount + ')' });
      this.chapter.topics.forEach((t) => {
        const n = this.countTopic(t);
        opts.push({ value: 'topic:' + t.id, label: 'Topic — ' + t.name + ' (' + n + ')' });
        t.subtopics.forEach((s) => {
          opts.push({ value: 'subtopic:' + this.chapter.chapter.id + '|' + t.id + '|' + s.id,
            label: 'Subtopic — ' + t.name + ' \u203A ' + s.name + ' (' + s.questions.length + ')' });
        });
      });
      return opts;
    },
    scopeCount() {
      if (!this.chapter) return 0;
      if (this.scope === 'chapter') return this.chapterCount;
      if (this.scope.indexOf('topic:') === 0) {
        const t = this.chapter.topics.find((x) => x.id === this.scope.slice(6));
        return t ? this.countTopic(t) : 0;
      }
      if (this.scope.indexOf('subtopic:') === 0) {
        const parts = this.scope.slice(9).split('|');
        const t = this.chapter.topics.find((x) => x.id === parts[1]);
        if (!t) return 0;
        const s = t.subtopics.find((x) => x.id === parts[2]);
        return s ? s.questions.length : 0;
      }
      return 0;
    },
    typeOptions() {
      return [{ v: '', l: 'All types' }].concat(G.APP.questionTypes.map((t) => ({ v: t, l: G.APP.typeLabels[t] })));
    },
    diffOptions() {
      return [{ v: '', l: 'All difficulties' }].concat(G.APP.difficulties.map((d) => ({ v: d, l: G.U.cap(d) })));
    }
  },
  methods: {
    countTopic(t) {
      let n = 0;
      t.subtopics.forEach((s) => { n += s.questions.length; });
      return n;
    },
    setScope(v) { this.scope = v; },
    subProgress(s) {
      let answered = 0;
      s.questions.forEach((q) => { if (G.Progress.isAnswered(q.id)) answered++; });
      return s.questions.length && answered ? Math.round((answered / s.questions.length) * 100) : null;
    },
    topicProgress(t) {
      let answered = 0, total = 0;
      t.subtopics.forEach((s) => {
        s.questions.forEach((q) => { total++; if (G.Progress.isAnswered(q.id)) answered++; });
      });
      return total && answered ? Math.round((answered / total) * 100) : null;
    },
    scopeLabel() {
      if (!this.chapter) return '';
      if (this.scope === 'chapter') return this.chapter.chapter.name;
      if (this.scope.indexOf('topic:') === 0) {
        const t = this.chapter.topics.find((x) => x.id === this.scope.slice(6));
        return t ? t.name : this.scope;
      }
      if (this.scope.indexOf('subtopic:') === 0) {
        const parts = this.scope.slice(9).split('|');
        const t = this.chapter.topics.find((x) => x.id === parts[1]);
        const s = t && t.subtopics.find((x) => x.id === parts[2]);
        return s ? s.name : this.scope;
      }
      return this.scope;
    },
    practice() {
      const f = { type: this.filters.type, difficulty: this.filters.difficulty };
      if (this.scope === 'chapter') f.chapterId = this.chapter.chapter.id;
      else if (this.scope.indexOf('topic:') === 0) {
        f.chapterId = this.chapter.chapter.id;
        f.topicId = this.scope.slice(6);
      } else if (this.scope.indexOf('subtopic:') === 0) {
        const parts = this.scope.slice(9).split('|');
        f.chapterId = parts[0];
        f.topicId = parts[1];
        f.subtopicId = parts[2];
      }
      const ok = G.Session.start({
        mode: 'chapter', title: this.scopeLabel(),
        filters: f, cap: this.cap, shuffle: this.shuffle
      });
      if (ok) G.UI.go('review');
    },
    practiceTopic(t) {
      this.scope = 'topic:' + t.id;
      this.practice();
    },
    practiceSubtopic(t, s) {
      this.scope = 'subtopic:' + this.chapter.chapter.id + '|' + t.id + '|' + s.id;
      this.practice();
    },
    goBack() { G.UI.go('chapters'); }
  },
  template:
    '<div class="page">' +
      '<button class="back-link" @click="goBack">&#8592; All chapters</button>' +
      '<div class="page-head" v-if="chapter">' +
        '<h1>{{ chapter.chapter.name }}</h1>' +
        '<p>{{ chapter.chapter.description || \'Select a topic and start practicing.\' }}</p>' +
      '</div>' +
      '<div class="practice-bar" v-if="chapter">' +
        '<span class="pb-label">Practice</span>' +
        '<select :value="scope" @change="setScope($event.target.value)">' +
          '<option v-for="o in scopeOptions" :key="o.value" :value="o.value">{{ o.label }}</option>' +
        '</select>' +
        '<select v-model="filters.type">' +
          '<option v-for="o in typeOptions" :key="o.v" :value="o.v">{{ o.l }}</option>' +
        '</select>' +
        '<select v-model="filters.difficulty">' +
          '<option v-for="o in diffOptions" :key="o.v" :value="o.v">{{ o.l }}</option>' +
        '</select>' +
        '<input type="number" v-model.number="cap" min="0" placeholder="limit" title="Question limit (0 = all)">' +
        '<label class="checkbox-line"><input type="checkbox" v-model="shuffle"> Shuffle</label>' +
        '<button class="btn btn-primary" @click="practice">Start ({{ scopeCount }})</button>' +
      '</div>' +
      '<template v-if="chapter">' +
        '<div class="topic-block" v-for="t in chapter.topics" :key="t.id">' +
          '<div class="topic-head">' +
            '<span class="topic-name">{{ t.name }}</span>' +
            '<span class="topic-count">{{ countTopic(t) }} questions' +
              '<span v-if="topicProgress(t) !== null"> &middot; {{ topicProgress(t) }}% done</span></span>' +
            '<span class="grow"></span>' +
            '<button class="btn btn-sm" @click="practiceTopic(t)">Practice topic</button>' +
          '</div>' +
          '<div class="topic-body">' +
            '<div class="subtopic-row" v-for="s in t.subtopics" :key="s.id">' +
              '<span class="tree-glyph">&#9500;&#9472;</span>' +
              '<span class="sub-name">{{ s.name }}</span>' +
              '<span class="sub-count">{{ s.questions.length }} q</span>' +
              '<span class="sub-count" v-if="subProgress(s) !== null" style="color:var(--green)">{{ subProgress(s) }}% done</span>' +
              '<span class="sub-count" v-else style="color:var(--t3)">new</span>' +
              '<button class="btn btn-sm btn-ghost" @click="practiceSubtopic(t, s)">Practice</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</template>' +
    '</div>'
};

const ReviewView = {
  name: 'ReviewView',
  data() {
    return {
      sources: [
        { id: 'due', label: 'Due questions' },
        { id: 'weak', label: 'Weak topics' },
        { id: 'unanswered', label: 'Unanswered' },
        { id: 'incorrect', label: 'Incorrect' },
        { id: 'all', label: 'All questions' }
      ],
      source: 'due',
      chapterId: '',
      type: '',
      difficulty: '',
      cap: 0,
      shuffle: true
    };
  },
  computed: {
    hasSession() { return !!(G.store.session && !G.store.session.done); },
    summary() { return G.store.sessionSummary; },
    chapterOptions() {
      return G.DataStore.chapters.map((c) => ({ id: c.chapter.id, name: c.chapter.name }));
    },
    typeOptions() {
      return [{ v: '', l: 'All types' }].concat(G.APP.questionTypes.map((t) => ({ v: t, l: G.APP.typeLabels[t] })));
    },
    diffOptions() {
      return [{ v: '', l: 'All difficulties' }].concat(G.APP.difficulties.map((d) => ({ v: d, l: G.U.cap(d) })));
    },
    sourceCount() {
      return G.Query.apply(this.buildFilters()).length;
    },
    sourceInfo() {
      return {
        due: 'Questions whose spaced-repetition interval has elapsed (most effective to review next).',
        weak: 'Subtopics with the lowest accuracy — see the Weak Topics page for details.',
        unanswered: 'Questions you have never attempted.',
        incorrect: 'Questions you have missed more often than answered correctly.',
        all: 'The entire question bank.'
      }[this.source] || '';
    }
  },
  methods: {
    buildFilters() {
      const f = { chapterId: this.chapterId, type: this.type, difficulty: this.difficulty };
      if (this.source === 'due') f.status = 'due';
      else if (this.source === 'unanswered') f.status = 'unanswered';
      else if (this.source === 'incorrect') f.status = 'incorrect';
      return f;
    },
    weakIds() {
      const ids = [];
      const groups = G.Stats.weakTopics(100);
      groups.forEach((g) => {
        const parts = g.key.split('|');
        G.DataStore.questions.forEach((q) => {
          if (q.chapterId === parts[0] && q.topicId === parts[1] && q.subtopicId === parts[2]) ids.push(q.id);
        });
      });
      return ids;
    },
    start() {
      if (this.source === 'weak') {
        const ids = this.weakIds();
        if (!ids.length) { G.UI.toast('No weak topics available yet — answer a few questions first', 'warn'); return; }
        G.Session.start({ mode: 'weak', title: 'Weak topics review', ids: ids, shuffle: this.shuffle, cap: this.cap });
        return;
      }
      const label = this.sources.find((s) => s.id === this.source);
      const ok = G.Session.start({
        mode: 'review', title: 'Review — ' + (label ? label.label : this.source),
        filters: this.buildFilters(), shuffle: this.shuffle, cap: this.cap
      });
      if (!ok) G.UI.toast('No questions match the selected criteria', 'warn');
    }
  },
  template:
    '<div class="page">' +
      '<div class="page-head">' +
        '<h1>Review</h1>' +
        '<p>Active recall with spaced repetition — retrieve first, then check.</p>' +
      '</div>' +
      '<practice-session v-if="hasSession"></practice-session>' +
      '<session-summary v-else-if="summary"></session-summary>' +
      '<div class="card" v-else>' +
        '<div class="card-title"><h3>Choose a queue</h3></div>' +
        '<div class="seg" style="margin-bottom:10px">' +
          '<button class="seg-btn" v-for="s in sources" :key="s.id" :class="{on: source === s.id}" @click="source = s.id">{{ s.label }}</button>' +
        '</div>' +
        '<p class="small muted" style="margin-bottom:14px">{{ sourceInfo }}</p>' +
        '<div class="filter-bar" style="background:transparent; border:none; padding:0">' +
          '<div class="fb-field">' +
            '<span class="fb-label">Chapter</span>' +
            '<select v-model="chapterId"><option value="">All chapters</option>' +
              '<option v-for="c in chapterOptions" :key="c.id" :value="c.id">{{ c.name }}</option></select>' +
          '</div>' +
          '<div class="fb-field">' +
            '<span class="fb-label">Type</span>' +
            '<select v-model="type"><option v-for="o in typeOptions" :key="o.v" :value="o.v">{{ o.l }}</option></select>' +
          '</div>' +
          '<div class="fb-field">' +
            '<span class="fb-label">Difficulty</span>' +
            '<select v-model="difficulty"><option v-for="o in diffOptions" :key="o.v" :value="o.v">{{ o.l }}</option></select>' +
          '</div>' +
          '<div class="fb-field">' +
            '<span class="fb-label">Limit (0 = all)</span>' +
            '<input type="number" v-model.number="cap" min="0" style="width:80px">' +
          '</div>' +
          '<label class="checkbox-line"><input type="checkbox" v-model="shuffle"> Shuffle</label>' +
          '<button class="btn btn-primary" @click="start">Start — {{ sourceCount }} questions</button>' +
        '</div>' +
      '</div>' +
    '</div>'
};

const WeakView = {
  name: 'WeakView',
  computed: {
    weak() { return G.Stats.weakTopics(100); },
    settings() { return G.Storage.state.settings; },
    hasSession() { return !!(G.store.session && G.store.session.mode === 'weak' && !G.store.session.done); },
    summary() { return G.store.sessionSummary; }
  },
  methods: {
    reviewGroup(g) {
      const parts = g.key.split('|');
      const ids = [];
      G.DataStore.questions.forEach((q) => {
        if (q.chapterId === parts[0] && q.topicId === parts[1] && q.subtopicId === parts[2]) ids.push(q.id);
      });
      G.Session.start({ mode: 'weak', title: 'Weak: ' + g.name, ids: ids, shuffle: true });
      G.UI.go('review');
    },
    reviewAll() {
      const ids = [];
      G.DataStore.questions.forEach((q) => {
        const acc = G.Progress.accuracyOf(q.id);
        const r = G.Progress.get(q.id);
        if (acc !== null && r.attempts >= this.settings.weakMinAttempts && acc < this.settings.weakMinAccuracy) ids.push(q.id);
      });
      if (!ids.length) { G.UI.toast('No weak questions right now', 'info'); return; }
      G.Session.start({ mode: 'weak', title: 'All weak questions', ids: ids, shuffle: true });
      G.UI.go('review');
    }
  },
  template:
    '<div class="page">' +
      '<div class="page-head">' +
        '<h1>Weak Topics</h1>' +
        '<p>Subtopics ranked by a weak score: low accuracy, incorrect answers, overdue reviews, hard difficulty.</p>' +
      '</div>' +
      '<practice-session v-if="hasSession"></practice-session>' +
      '<session-summary v-else-if="summary"></session-summary>' +
      '<template v-else>' +
        '<div class="notice info" style="font-size:12px">' +
          'Weak score = (1 &minus; accuracy) &times; 60 + overdue &times; 1.6 + incorrect &times; 0.8 + hard-difficulty bonus. ' +
          'Only subtopics with at least {{ settings.weakMinAttempts }} attempt(s) are considered; weak = accuracy below {{ settings.weakMinAccuracy }}%.' +
        '</div>' +
        '<div class="summary-actions" style="margin-bottom:14px" v-if="weak.length">' +
          '<button class="btn btn-primary" @click="reviewAll">Review all weak questions</button>' +
        '</div>' +
        '<div class="card" v-if="!weak.length">' +
          '<div class="empty-state">' +
            '<div class="es-icon">&#10003;</div>' +
            '<div class="es-title">Nothing weak right now</div>' +
            '<div class="small">Keep reviewing — weak topics appear once you have answer history.</div>' +
          '</div>' +
        '</div>' +
        '<div class="weak-list" v-else>' +
          '<div class="weak-item" v-for="w in weak" :key="w.key">' +
            '<div class="wi-info">' +
              '<div class="wi-name">{{ w.name }}</div>' +
              '<div class="wi-sub">{{ w.chapter }} &middot; {{ w.topic }} &middot; {{ w.questions }} questions &middot; {{ w.overdue }} overdue &middot; score {{ w.score }}</div>' +
              '<div class="bar" style="margin-top:6px"><div class="bar-fill" :class="G.UI.accClass(w.accuracy)" :style="{ width: w.accuracy + \'%\' }"></div></div>' +
            '</div>' +
            '<div class="wi-stats">' +
              '<div class="acc" :class="G.UI.accClass(w.accuracy)">{{ w.accuracy }}%</div>' +
              '<div class="att">{{ w.attempts }} attempts</div>' +
            '</div>' +
            '<button class="btn btn-sm" @click="reviewGroup(w)">Review</button>' +
          '</div>' +
        '</div>' +
      '</template>' +
    '</div>'
};

    maxActivity() { return Math.max(1, ...this.activity.map((a) => a.attempts)); },
    weekAcc() {

      return G.U.pct(cor, att);

    label(t) { return G.APP.typeLabels[t] || t; },

      return G.DataStore.chapters.map((c) => ({ id: c.chapter.id, name: c.chapter.name }));

      const ch = G.DataStore.chapters.find((c) => c.chapter.id === this.f.chapterId);
      return ch ? ch.topics.map((t) => ({ id: t.id, name: t.name })) : [];
    },
    subtopicOptions() {
      const ch = G.DataStore.chapters.find((c) => c.chapter.id === this.f.chapterId);

      return t ? t.subtopics.map((s) => ({ id: s.id, name: s.name })) : [];
    },
    tagOptions() { return G.DataStore.allTags; },

      return [{ v: '', l: 'All types' }].concat(G.APP.questionTypes.map((t) => ({ v: t, l: G.APP.typeLabels[t] })));
    },
    diffOptions() {
      return [{ v: '', l: 'All difficulties' }].concat(G.APP.difficulties.map((d) => ({ v: d, l: G.U.cap(d) })));
    },
    statusOptions() {
      return [
        { v: '', l: 'Any status' }, { v: 'due', l: 'Due today' }, { v: 'unanswered', l: 'Unanswered' },
        { v: 'incorrect', l: 'Incorrect' }, { v: 'completed', l: 'Completed' }, { v: 'weak', l: 'Weak' }
      ];
    },
    results() { return G.Query.apply(this.f); },
    resultStats() {
      let att = 0, cor = 0;
      this.results.forEach((q) => {
        const r = G.Progress.get(q.id);
        if (r) { att += r.attempts; cor += r.correct; }
      });
      return { accuracy: G.U.pct(cor, att), answered: this.results.filter((q) => G.Progress.isAnswered(q.id)).length };
    }
  },
  methods: {
    toggle(qid) { this.open[qid] = !this.open[qid]; },
    isOpen(qid) { return !!this.open[qid]; },
    onChapterChange() { this.f.topicId = ''; this.f.subtopicId = ''; },
    onTopicChange() { this.f.subtopicId = ''; },
    clearFilters() {
      this.f = G.Query.defaultFilters();
      this.open = {};

    practice() {

      G.Session.start({ mode: 'browse', title: 'Filtered practice', ids: ids, shuffle: true, cap: G.Storage.state.settings.queueCap });
      G.UI.go('review');
    },
    practiceOne(qid) {
      G.Session.start({ mode: 'single', title: 'Single question', ids: [qid] });
      G.UI.go('review');
    }

    '<div class="page">' +

        '<div class="fb-field"><span class="fb-label">Subtopic</span>' +

        '<div class="fb-field"><span class="fb-label">Type</span>' +
          '<select v-model="f.type"><option v-for="o in typeOptions" :key="o.v" :value="o.v">{{ o.l }}</option></select></div>' +
        '<div class="fb-field"><span class="fb-label">Difficulty</span>' +
          '<select v-model="f.difficulty"><option v-for="o in diffOptions" :key="o.v" :value="o.v">{{ o.l }}</option></select></div>' +
        '<div class="fb-field"><span class="fb-label">Tag</span>' +
          '<select v-model="f.tag"><option value="">Any tag</option>' +
          '<option v-for="t in tagOptions" :key="t" :value="t">{{ t }}</option></select></div>' +
        '<div class="fb-field"><span class="fb-label">Status</span>' +
          '<select v-model="f.status"><option v-for="o in statusOptions" :key="o.v" :value="o.v">{{ o.l }}</option></select></div>' +
        '<div class="fb-field grow"><span class="fb-label">Search text</span>' +
          '<div class="search-box"><span class="search-glyph">&#8981;</span>' +
          '<input type="text" v-model="f.search" placeholder="keyword..."></div></div>' +
        '<button class="btn btn-ghost btn-sm" @click="clearFilters">Clear</button>' +
      '</div>' +
      '<div class="practice-bar">' +
        '<span class="pb-label">{{ results.length }} questions' +
          '<span v-if="resultStats.answered"> &middot; {{ resultStats.answered }} answered &middot; {{ resultStats.accuracy }}% accuracy</span></span>' +
        '<span class="grow"></span>' +
        '<button class="btn btn-primary" @click="practice">Practice matched ({{ results.length }})</button>' +
      '</div>' +
      '<div class="qlist-item" v-for="q in results" :key="q.id">' +
        '<div class="qli-head" @click="toggle(q.id)">' +

const SearchView = {
  name: 'SearchView',
  data() {
    return { query: '', results: [], searched: false, open: {} };
  },
  computed: {
    grouped() {
      const groups = {};
      this.results.forEach((q) => {
        const k = q.chapterId + '|' + q.topicId + '|' + q.subtopicId;
        if (!groups[k]) {
          groups[k] = { chapter: q.chapterName, topic: q.topicName, subtopic: q.subtopicName, questions: [] };
        }
        groups[k].questions.push(q);
      });
      return groups;
    }
  },
  methods: {
    run() {
      if (!this.query.trim()) { this.results = []; this.searched = true; return; }
      this.results = G.Query.search(this.query);
      this.searched = true;
      this.open = {};
    },
    toggle(qid) { this.open[qid] = !this.open[qid]; },
    isOpen(qid) { return !!this.open[qid]; },
    practiceAll() {
      if (!this.results.length) return;
      G.Session.start({ mode: 'search', title: 'Search: ' + this.query.trim(), ids: this.results.map((q) => q.id), shuffle: false, cap: 0 });
      G.UI.go('review');
    },
    practiceOne(qid) {
      G.Session.start({ mode: 'single', title: 'Single question', ids: [qid] });
      G.UI.go('review');
    }
  },
  template:
    '<div class="page">' +
      '<div class="page-head"><h1>Search</h1><p>Searches question text, answers, explanations, tags, chapter, topic and subtopic.</p></div>' +
      '<div class="filter-bar">' +
        '<div class="search-box grow">' +
          '<span class="search-glyph">&#8981;</span>' +
          '<input type="text" v-model="query" placeholder=\'e.g. "feasible successor"\' @keyup.enter="run">' +
        '</div>' +
        '<button class="btn btn-primary" @click="run">Search</button>' +
      '</div>' +
      '<template v-if="searched">' +
        '<div class="notice info" v-if="!results.length">No matches for "{{ query }}". Try a shorter phrase or a tag like "ospf" or "stp".</div>' +
        '<template v-else>' +
          '<div class="search-group" v-for="(g, gk) in grouped" :key="gk">' +
            '<div class="sg-head"><b>{{ g.chapter }}</b> &rarr; <b>{{ g.topic }}</b> &rarr; {{ g.subtopic }} &middot; {{ g.questions.length }} question(s)</div>' +
            '<div class="qlist-item" v-for="q in g.questions.slice(0, 8)" :key="q.id">' +
              '<div class="qli-head" @click="toggle(q.id)">' +
                '<span class="badge" :class="\'type-\' + q.type" style="flex:0 0 auto">{{ q.type }}</span>' +
                '<span class="qli-q">{{ q.question }}</span>' +
              '</div>' +
              '<div class="qli-body" v-if="isOpen(q.id)">' +
                '<div class="answer-box"><h4>Answer</h4><pre>{{ q.answerText }}</pre></div>' +
                '<div class="explanation-box"><h4>Explanation</h4><p>{{ q.explanation }}</p></div>' +
                '<button class="btn btn-sm" @click="practiceOne(q.id)">Practice this question</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="summary-actions">' +
            '<button class="btn btn-primary" @click="practiceAll">Practice all {{ results.length }} matches</button>' +
          '</div>' +
        '</template>' +
      '</template>' +
    '</div>'
};

const SettingsView = {
  name: 'SettingsView',
  computed: {
    s() { return G.Storage.state.settings; },
    statuses() {
      return G.APP.questionFiles.map((f) => ({
        path: f.path,
        state: G.store.fileStatus[f.path] || { state: 'unknown', message: '' },
        count: G.DataStore.chapterCounts[f.chapterId] || 0
      }));
    },
    storageKey() { return G.APP.storageKey; }
  },
  methods: {
    setTheme(v) {
      this.s.theme = v;
      document.documentElement.setAttribute('data-theme', v);
      G.Storage.save();
    },
    save() { G.Storage.save(); },
    exportProgress() {
      const payload = G.Storage.exportJson();
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'networking-recall-progress-' + G.U.todayStr() + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      G.UI.toast('Progress exported', 'ok');
    },
    onImportFile(evt) {
      const file = evt.target.files && evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      const self = this;
      reader.onload = function () {
        let data;
        try { data = JSON.parse(reader.result); }
        catch (e) { G.UI.toast('Import failed — the file is not valid JSON', 'err'); evt.target.value = ''; return; }
        if (!data || typeof data !== 'object' || !data.progress) {
          G.UI.toast('Import failed — no progress data found in this file', 'err');
          evt.target.value = '';
          return;
        }
        const n = Object.keys(data.progress).length;
        G.UI.confirm({
          title: 'Import progress',
          body: 'This file contains records for ' + n + ' question(s). Merge combines it with your current data; Replace overwrites your progress entirely.',
          confirmText: 'Merge',
          altText: 'Replace',
          onAlt: function () { self.doImport(data, 'replace'); },
          onConfirm: function () { self.doImport(data, 'merge'); }
        });
        evt.target.value = '';
      };
      reader.readAsText(file);
    },
    doImport(data, mode) {
      G.Storage.importData(data, mode);
      G.UI.toast('Imported (' + mode + ')', 'ok');
    },
    resetProgress() {
      G.UI.confirm({
        title: 'Reset all progress?',
        body: 'This permanently deletes all attempts, ratings, streaks and session history from this browser. The question bank JSON files are never touched.',
        confirmText: 'Delete everything',
        danger: true,
        onConfirm: function () {
          G.Storage.reset();
          G.UI.toast('All progress has been reset', 'warn');
        }
      });
    },
    reloadData() {
      G.store.appReady = false;
      G.store.loadErrors = [];
      G.store.validationErrors = [];
      G.DataStore.loadAll().then(function () {
        G.store.appReady = true;
      });
    }
  },
  template:
    '<div class="page">' +
      '<div class="page-head"><h1>Settings</h1><p>Preferences and data management — everything lives locally in this browser.</p></div>' +
      '<div class="card settings-section">' +
        '<div class="card-title"><h3>Appearance</h3></div>' +
        '<div class="setting-row">' +
          '<div class="sr-info">Theme<div class="sr-desc">Dark-first interface, tuned for network operations aesthetics.</div></div>' +
          '<div class="seg">' +
            '<button class="seg-btn" :class="{on: s.theme === \'dark\'}" @click="setTheme(\'dark\')">Dark</button>' +
            '<button class="seg-btn" :class="{on: s.theme === \'light\'}" @click="setTheme(\'light\')">Light</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="card settings-section">' +
        '<div class="card-title"><h3>Review defaults</h3></div>' +
        '<div class="setting-row">' +
          '<div class="sr-info">Queue cap<div class="sr-desc">Maximum questions per review session (0 = no limit).</div></div>' +
          '<input type="number" min="0" style="width:90px; background:var(--bg1); border:1px solid var(--line2); border-radius:6px; padding:5px 8px" v-model.number="s.queueCap" @change="save">' +
        '</div>' +
        '<div class="setting-row">' +
          '<div class="sr-info">Show hints after reveal<div class="sr-desc">Display the optional hint button once the answer is shown.</div></div>' +
          '<label class="switch"><input type="checkbox" v-model="s.showHints" @change="save"><span class="slider"></span></label>' +
        '</div>' +
        '<div class="setting-row">' +
          '<div class="sr-info">Answer match threshold<div class="sr-desc">Free-text answers count as correct when token similarity is at or above this fraction.</div></div>' +
          '<input type="number" min="0" max="1" step="0.05" style="width:90px; background:var(--bg1); border:1px solid var(--line2); border-radius:6px; padding:5px 8px" v-model.number="s.tokenThreshold" @change="save">' +
        '</div>' +
        '<div class="setting-row">' +
          '<div class="sr-info">Weak topic filters<div class="sr-desc">Min attempts and max accuracy (%) for a subtopic to count as weak.</div></div>' +
          '<div style="display:flex; gap:8px">' +
            '<input type="number" min="1" style="width:80px; background:var(--bg1); border:1px solid var(--line2); border-radius:6px; padding:5px 8px" v-model.number="s.weakMinAttempts" @change="save" title="min attempts">' +
            '<input type="number" min="0" max="100" style="width:80px; background:var(--bg1); border:1px solid var(--line2); border-radius:6px; padding:5px 8px" v-model.number="s.weakMinAccuracy" @change="save" title="max accuracy %">' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="card settings-section">' +
        '<div class="card-title"><h3>Data management</h3></div>' +
        '<div class="setting-row">' +
          '<div class="sr-info">Export progress<div class="sr-desc">Download all learning progress as a JSON file (question banks are never modified).</div></div>' +
          '<button class="btn btn-sm" @click="exportProgress">Export</button>' +
        '</div>' +
        '<div class="setting-row">' +
          '<div class="sr-info">Import progress<div class="sr-desc">Restore from an exported file. Merge combines; Replace overwrites.</div></div>' +
          '<label class="btn btn-sm" style="cursor:pointer">Import<input type="file" accept="application/json,.json" style="display:none" @change="onImportFile"></label>' +
        '</div>' +
        '<div class="setting-row">' +
          '<div class="sr-info">Reset progress<div class="sr-desc">Delete all attempts, ratings, streaks and sessions from this browser.</div></div>' +
          '<button class="btn btn-sm btn-danger" @click="resetProgress">Reset</button>' +
        '</div>' +
      '</div>' +
      '<div class="card settings-section">' +
        '<div class="card-title"><h3>Data sources</h3><button class="btn btn-sm btn-ghost" @click="reloadData">Reload all</button></div>' +
        '<div class="data-source-row" v-for="st in statuses" :key="st.path">' +
          '<span class="ds-status"><span v-if="st.state.state === \'ok\'" class="ok">&#10003;</span><span v-else-if="st.state.state === \'error\'" class="err">&#10007;</span><span v-else>&#8212;</span></span>' +
          '<span class="mono">{{ st.path }}</span>' +
          '<span class="muted small" v-if="st.state.state === \'ok\'">{{ st.count }} questions</span>' +
          '<span class="ds-err" v-if="st.state.state === \'error\'">{{ st.state.message }}</span>' +
        '</div>' +
        '<p class="small muted" style="margin-top:10px">Question banks are loaded from JSON files under ./data/ — they are read-only. ' +
          'Your progress lives in localStorage under the key "{{ storageKey }}".</p>' +
      '</div>' +
      '<div class="card settings-section">' +
        '<div class="card-title"><h3>About</h3></div>' +
        '<p class="small muted" style="margin-bottom:6px"><b>Networking Recall</b> v{{ G.APP.version }} &middot; active-recall + spaced-repetition study system for Obsidian vaults. ' +
          'Works fully offline after the Vue CDN library has loaded once. Keyboard: Space = reveal, 1&ndash;4 = rating, N = next, R = random, E = exam, Esc = close dialog.</p>' +
      '</div>' +
    '</div>'
};

const ConfirmModal = {
  name: 'ConfirmModal',
  computed: {
    m() { return G.store.modal; }
  },
  methods: {
    cancel() { G.UI.closeModal(); },
    confirm() { G.UI.doConfirm(); },
    alt() {
      const m = this.m;

      const fn = m.onAlt;
      G.store.modal = null;
      fn();
    }
  },
  template:
    '<div class="modal-overlay" v-if="m" @click.self="cancel">' +
      '<div class="modal-card">' +
        '<h3>{{ m.title }}</h3>' +
        '<p>{{ m.body }}</p>' +
        '<div class="modal-actions">' +
          '<button class="btn" @click="cancel">{{ m.cancelText || \'Cancel\' }}</button>' +
          '<button class="btn" v-if="m.altText" @click="alt">{{ m.altText }}</button>' +
          '<button class="btn" :class="m.danger ? \'btn-danger\' : \'btn-primary\'" @click="confirm">{{ m.confirmText || \'Confirm\' }}</button>' +
        '</div>' +

};

/* ---------- root application ---------- */
const app = Vue.createApp({
  name: 'NetworkingRecallApp',
  mounted() {
    window.addEventListener('keydown', this.onKey);
  },
  beforeUnmount() {
    window.removeEventListener('keydown', this.onKey);
  },
  methods: {
    onKey(e) {
      if (G.store.modal) {
        if (e.key === 'Escape') G.UI.closeModal();
        return;
      }
      const t = e.target;
      const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
      if (typing) return;
      if (!G.store.appReady) return;
      const k = e.key.toLowerCase();

      if (G.store.exam && !G.store.exam.finished) {
        if (e.key === 'ArrowLeft') { e.preventDefault(); G.Exam.prev(); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); G.Exam.next(); }
        return;
      }

      const s = G.store.session;
      if (e.key === ' ' || e.code === 'Space') {
        if (s && !s.done && !s.revealed) {
          e.preventDefault();
          G.Session.reveal();
        }
        return;
      }
      if (k === '1' || k === '2' || k === '3' || k === '4') {
        if (s && !s.done && s.revealed) {
          e.preventDefault();
          G.Session.rate({ '1': 'again', '2': 'hard', '3': 'good', '4': 'easy' }[k]);
        }
        return;
      }
      if (k === 'n') {
        if (s && !s.done) {
          e.preventDefault();
          G.Session.next();
        }
        return;
      }
      if (k === 'r') { G.UI.go('random'); return; }
      if (k === 'e') { G.UI.go('exam'); return; }
      if (k === 'escape') { G.UI.closeModal(); }
    }
  }
});

app.config.globalProperties.G = G;

/* ============================================================
   18. INITIALISATION
   ============================================================ */
function init() {
  const saved = Storage.load();
  document.documentElement.setAttribute('data-theme', saved.settings.theme);
  store.fileProtocol = window.location.protocol === 'file:';
  async function loadAll() {
    store.loadState = 'loading';
    try {
      await DataStore.loadAll();
    } catch (e) {
      store.loadErrors.push({ file: '(loader)', message: String((e && e.message) || e) });
    }
    if (!DataStore.questions.length && !DataStore.loadErrors.length) {
      store.loadErrors.push({ file: '(loader)', message: 'No questions were found in any data file.' });
    }
    store.loadState = DataStore.loadErrors.length ? 'error' : 'ok';
    store.appReady = true;
  }
  loadAll();
  app.mount('#app');
}

function tryMount() {
  if (typeof Vue === 'undefined') {
    setTimeout(function () {
      if (typeof Vue === 'undefined') {
        document.getElementById('app').style.display = 'none';
        document.getElementById('vue-fallback').style.display = 'flex';
      } else {
        init();
      }
    }, 2500);
    return;
  }
  init();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', tryMount);
} else {
  tryMount();
}
