<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root, [data-theme="dark"] {
  --bg0: #070b11;
  --bg1: #0c1320;
  --bg2: #101a2b;
  --card: #0e1626;
  --card2: #132035;
  --card3: #182742;
  --line: #1b293d;
  --line2: #253650;
  --t0: #e9eff8;
  --t1: #aebccf;
  --t2: #71829b;
  --t3: #4b5a70;
  --green: #3ddc84;
  --green-dim: #1f7a4e;
  --red: #ff5d6c;
  --red-dim: #8a2e3a;
  --amber: #ffb454;
  --amber-dim: #8a5f24;
  --blue: #4da3ff;
  --blue-dim: #24558f;
  --cyan: #3ecfd6;
  --cyan-dim: #1f6f74;
  --purple: #a98bff;
  --purple-dim: #5d4a99;
  --pink: #ff7eb0;
  --orange: #ff9040;
  --term-bg: #04070c;
  --term-line: #1b2436;
  --shadow: 0 8px 24px rgba(0,0,0,.35);
  --radius: 10px;
  --radius-sm: 6px;
  --sans: -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sidebar-w: 232px;
  --ok: var(--green);
  --bad: var(--red);
}
[data-theme="light"] {
  --bg0: #eef1f6;
  --bg1: #f7f9fc;
  --bg2: #e6ebf3;
  --card: #ffffff;
  --card2: #f1f4f9;
  --card3: #e6ebf4;
  --line: #d5dde8;
  --line2: #bcc8d8;
  --t0: #141b26;
  --t1: #3d4a5c;
  --t2: #64748a;
  --t3: #94a3b8;
  --green: #12905a;
  --green-dim: #c9f0dc;
  --red: #d33547;
  --red-dim: #f8d3d8;
  --amber: #b26a10;
  --amber-dim: #f7e2c4;
  --blue: #1f6fd6;
  --blue-dim: #cfe3fb;
  --cyan: #0f7f86;
  --cyan-dim: #c9eef0;
  --purple: #6d4fd1;
  --purple-dim: #e2dafb;
  --pink: #c2407c;
  --orange: #c96a12;
  --term-bg: #f4f6fa;
  --term-line: #dfe6f0;
  --shadow: 0 8px 24px rgba(30,41,59,.12);
}

/* ============================================================
   2. BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg0);
  color: var(--t0);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
[v-cloak] { display: none !important; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0 0 .4em; font-weight: 650; line-height: 1.25; }
h1 { font-size: 21px; }
h2 { font-size: 16px; }
h3 { font-size: 14px; }
h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--t2); margin-bottom: .5em; }
p { margin: 0 0 .8em; }
code { font-family: var(--mono); font-size: .92em; background: var(--bg1); border: 1px solid var(--line); border-radius: 4px; padding: .05em .35em; color: var(--cyan); }
kbd {
  font-family: var(--mono); font-size: 10.5px; color: var(--t2);
  background: var(--bg1); border: 1px solid var(--line2); border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 5px; margin-left: 4px;
}
::selection { background: var(--blue-dim); color: var(--t0); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 6px; border: 2px solid var(--bg0); }
::-webkit-scrollbar-thumb:hover { background: var(--t3); }
input, select, textarea, button { font-family: inherit; font-size: 14px; color: var(--t0); }
.mono { font-family: var(--mono); }
.muted { color: var(--t2); }
.small { font-size: 12px; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }

/* ============================================================
   3. LAYOUT
   ============================================================ */
.app { min-height: 100vh; display: flex; }
.sidebar {
  width: var(--sidebar-w);
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 40;
  background: var(--bg1);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  transition: transform .22s ease;
}
.sidebar .brand {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--line);
}
.brand-mark {
  width: 36px; height: 36px; flex: 0 0 36px;
  border-radius: 8px; background: linear-gradient(135deg, var(--green-dim), var(--blue-dim));
  border: 1px solid var(--line2);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--t0);
}
.brand-name { font-weight: 700; font-size: 13.5px; letter-spacing: .02em; }
.brand-sub { font-size: 11px; color: var(--t2); font-family: var(--mono); }
.sidebar nav { flex: 1; overflow-y: auto; padding: 10px 8px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; margin-bottom: 2px;
  border-radius: var(--radius-sm);
  color: var(--t1); cursor: pointer;
  border: 1px solid transparent;
  font-size: 13.5px; font-weight: 500;
  user-select: none;
}
.nav-item:hover { background: var(--bg2); color: var(--t0); }
.nav-item.active { background: var(--card3); color: var(--t0); border-color: var(--line2); }
.nav-icon { width: 20px; text-align: center; color: var(--t2); font-size: 14px; }
.nav-item.active .nav-icon { color: var(--green); }
.nav-badge {
  margin-left: auto; font-family: var(--mono); font-size: 11px;
  background: var(--red-dim); color: var(--red);
  border-radius: 999px; padding: 1px 7px; border: 1px solid var(--line2);
}
.sidebar-foot {
  border-top: 1px solid var(--line); padding: 12px 14px;
  font-size: 11.5px; color: var(--t2); font-family: var(--mono);
}
.sidebar-foot div { margin-bottom: 3px; }
.sidebar-close { display: none; }
.main {
  flex: 1; min-width: 0;
  margin-left: var(--sidebar-w);
  padding: 26px 30px 70px;
}
.topbar {
  display: none;
  position: sticky; top: 0; z-index: 30;
  background: var(--bg1); border-bottom: 1px solid var(--line);
  padding: 10px 14px; align-items: center; gap: 12px;
}
.topbar .brand-name { font-size: 14px; }
.topbar .hamburger, .sidebar-close {
  background: transparent; border: 1px solid var(--line); color: var(--t1);
  border-radius: var(--radius-sm); padding: 4px 10px; cursor: pointer; font-size: 15px;
}
.topbar .hamburger:hover { color: var(--t0); border-color: var(--line2); }
.sidebar-overlay {
  display: none; position: fixed; inset: 0; z-index: 35;
  background: rgba(0,0,0,.5);
}
.page { max-width: 1100px; margin: 0 auto; animation: fadeIn .18s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.page-head { margin-bottom: 20px; }
.page-head p { color: var(--t2); margin: 2px 0 0; font-size: 13px; }
.page-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.back-link {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  color: var(--t2); font-size: 13px; margin-bottom: 10px;
  background: transparent; border: none; padding: 2px 0;
}
.back-link:hover { color: var(--t0); }
.section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--t2); margin: 26px 0 12px; font-weight: 700; }

/* ============================================================
   4. CARDS, GRIDS, STATS
   ============================================================ */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}
.card + .card { margin-top: 14px; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
@media (max-width: 900px) {
  .grid-3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 620px) { .grid-3 { grid-template-columns: 1fr; } }
.stat-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px;
}
.stat-card .stat-value { font-size: 26px; font-weight: 700; font-family: var(--mono); letter-spacing: -.02em; }
.stat-card .stat-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--t2); margin-top: 2px; }
.stat-card .stat-sub { font-size: 11.5px; color: var(--t2); margin-top: 4px; }
.stat-card.accent { border-color: var(--line2); background: linear-gradient(180deg, var(--card2), var(--card)); }
.stat-value.ok { color: var(--green); }
.stat-value.warn { color: var(--amber); }
.stat-value.bad { color: var(--red); }
.stat-value.info { color: var(--blue); }
.dash-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.dash-cols { display: grid; grid-template-columns: 1fr 1.4fr; gap: 14px; align-items: start; }
@media (max-width: 900px) { .dash-cols { grid-template-columns: 1fr; } }

/* ============================================================
   5. BUTTONS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--bg2); color: var(--t0);
  border: 1px solid var(--line2); border-radius: var(--radius-sm);
  padding: 7px 14px; font-size: 13px; font-weight: 600;
  cursor: pointer; user-select: none; white-space: nowrap;
  transition: background .12s, border-color .12s, transform .05s;
}
.btn:hover { background: var(--card3); border-color: var(--t3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--green-dim); border-color: var(--green); color: #eafff2; }
.btn-primary:hover { background: var(--green); color: #04150c; }
.btn-danger { background: var(--red-dim); border-color: var(--red); color: #ffe9ec; }
.btn-danger:hover { background: var(--red); color: #2a0409; }
.btn-ghost { background: transparent; }
.btn-lg { padding: 10px 20px; font-size: 14px; }
.btn-sm { padding: 4px 9px; font-size: 12px; }
.btn .key-hint { opacity: .7; font-family: var(--mono); font-size: 11px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg .seg-btn {
  background: var(--bg1); color: var(--t1);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 5px 12px; font-size: 12.5px; cursor: pointer; font-weight: 600;
}
.seg .seg-btn:hover { color: var(--t0); border-color: var(--line2); }
.seg .seg-btn.on { background: var(--card3); border-color: var(--blue); color: var(--blue); }
.seg .seg-btn.danger-on { border-color: var(--red); color: var(--red); background: var(--red-dim); }

/* ============================================================
   6. BADGES & BARS
   ============================================================ */
.badge {
  display: inline-flex; align-items: center;
  font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  border: 1px solid var(--line2); border-radius: 999px; padding: 2px 9px;
  color: var(--t1); background: var(--bg1);
}
.badge.type-recall { color: var(--blue); border-color: var(--blue-dim); background: var(--blue-dim); }
.badge.type-multiple_choice { color: var(--cyan); border-color: var(--cyan-dim); background: var(--cyan-dim); }
.badge.type-true_false { color: var(--cyan); border-color: var(--cyan-dim); background: var(--cyan-dim); }
.badge.type-fill_blank { color: var(--purple); border-color: var(--purple-dim); background: var(--purple-dim); }
.badge.type-command { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-dim); }
.badge.type-configuration { color: var(--purple); border-color: var(--purple-dim); background: var(--purple-dim); }
.badge.type-troubleshooting { color: var(--red); border-color: var(--red-dim); background: var(--red-dim); }
.badge.type-scenario { color: var(--orange); border-color: var(--amber-dim); background: var(--amber-dim); }
.badge.type-compare { color: var(--pink); border-color: var(--line2); background: var(--bg1); }
.badge.type-explain { color: var(--green); border-color: var(--green-dim); background: var(--green-dim); }
.badge.type-packet_flow { color: var(--blue); border-color: var(--blue-dim); background: var(--blue-dim); }
.badge.type-show_command { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-dim); }
.badge.diff-easy { color: var(--green); border-color: var(--green-dim); background: var(--green-dim); }
.badge.diff-medium { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-dim); }
.badge.diff-hard { color: var(--red); border-color: var(--red-dim); background: var(--red-dim); }
.badge.ok { color: var(--green); border-color: var(--green-dim); background: var(--green-dim); }
.badge.bad { color: var(--red); border-color: var(--red-dim); background: var(--red-dim); }
.bar { height: 7px; background: var(--bg1); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--blue-dim), var(--blue)); transition: width .3s ease; }
.bar-fill.ok { background: linear-gradient(90deg, var(--green-dim), var(--green)); }
.bar-fill.warn { background: linear-gradient(90deg, var(--amber-dim), var(--amber)); }
.bar-fill.bad { background: linear-gradient(90deg, var(--red-dim), var(--red)); }
.bar-fill.purple { background: linear-gradient(90deg, var(--purple-dim), var(--purple)); }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.bar-row .bar-label { width: 170px; flex: 0 0 170px; font-size: 12.5px; color: var(--t1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .bar { flex: 1; }
.bar-row .bar-num { width: 42px; flex: 0 0 42px; text-align: right; font-family: var(--mono); font-size: 12px; color: var(--t2); }

/* ============================================================
   7. TABLES & LISTS
   ============================================================ */
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--t2); padding: 6px 10px; border-bottom: 1px solid var(--line2); font-weight: 700;
}
.table td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tr:hover td { background: var(--bg1); }
.list-plain { list-style: none; margin: 0; padding: 0; }
.list-plain li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.list-plain li:last-child { border-bottom: none; }

/* ============================================================
   8. CHAPTERS & TOPICS
   ============================================================ */
.chapter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.chapter-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; cursor: pointer; transition: border-color .12s, transform .12s;
}
.chapter-card:hover { border-color: var(--line2); transform: translateY(-1px); }
.chapter-card h3 { margin-bottom: 3px; }
.chapter-card .ch-ids { font-family: var(--mono); font-size: 11px; color: var(--t3); }
.chapter-card .ch-meta { display: flex; gap: 14px; font-size: 12px; color: var(--t2); margin: 8px 0 10px; flex-wrap: wrap; }
.chapter-card .ch-meta b { color: var(--t0); font-family: var(--mono); font-weight: 600; }
.topic-block { margin-bottom: 20px; }
.topic-head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--card2); border: 1px solid var(--line);
  border-radius: var(--radius) var(--radius) 0 0;
}
.topic-head .topic-name { font-weight: 700; font-size: 14.5px; }
.topic-head .topic-count { font-family: var(--mono); font-size: 12px; color: var(--t2); }
.topic-body { border: 1px solid var(--line); border-top: none; border-radius: 0 0 var(--radius) var(--radius); }
.subtopic-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--t1);
}
.subtopic-row:first-child { border-top: none; }
.subtopic-row .sub-name { flex: 1; }
.subtopic-row:hover { background: var(--bg1); }
.subtopic-row .sub-count { font-family: var(--mono); font-size: 12px; color: var(--t3); }
.tree-glyph { font-family: var(--mono); color: var(--t3); font-size: 12px; }
.practice-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--card2); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; margin-bottom: 18px;
}
.practice-bar .pb-label { font-size: 12px; color: var(--t2); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.practice-bar select, .filter-bar select {
  background: var(--bg1); border: 1px solid var(--line2); border-radius: var(--radius-sm);
  padding: 5px 8px; font-size: 12.5px; color: var(--t0);
}
.practice-bar input[type=number] {
  background: var(--bg1); border: 1px solid var(--line2); border-radius: var(--radius-sm);
  padding: 5px 8px; width: 70px; font-size: 12.5px; font-family: var(--mono);
}
.checkbox-line { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--t1); cursor: pointer; user-select: none; }
.checkbox-line input { accent-color: var(--green); }

/* ============================================================
   9. QUESTION PANEL
   ============================================================ */
.q-panel { }
.q-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.q-crumb { font-family: var(--mono); font-size: 11.5px; color: var(--t2); }
.q-tags { margin-left: auto; display: flex; gap: 5px; flex-wrap: wrap; }
.q-tag { font-family: var(--mono); font-size: 10.5px; color: var(--t3); background: var(--bg1); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.q-text { font-size: 16.5px; font-weight: 600; line-height: 1.55; margin: 4px 0 16px; }
.q-scenario {
  background: var(--bg1); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 13px 15px; margin-bottom: 14px;
}
.q-scenario h4 { margin-top: 10px; }
.q-scenario h4:first-child { margin-top: 0; }
.q-scenario .sym-list { margin: 0; padding-left: 18px; font-size: 13px; color: var(--t1); }
.q-scenario .sym-list li { margin-bottom: 3px; }
.q-scenario .sym-list li::marker { color: var(--red); }
.q-scenario .topo-text { font-size: 13px; color: var(--t1); margin: 0; }
.mc-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.mc-opt {
  display: flex; align-items: center; gap: 10px;
  text-align: left; background: var(--bg1); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 10px 13px; cursor: pointer;
  font-size: 13.5px; color: var(--t0); width: 100%;
}
.mc-opt .mc-letter {
  flex: 0 0 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line2); border-radius: 50%;
  font-family: var(--mono); font-size: 11px; color: var(--t2);
}
.mc-opt:hover { border-color: var(--line2); background: var(--bg2); }
.mc-opt.selected { border-color: var(--blue); background: var(--blue-dim); }
.mc-opt.selected .mc-letter { color: var(--blue); border-color: var(--blue); }
.mc-opt.right { border-color: var(--green); background: var(--green-dim); color: var(--t0); }
.mc-opt.right .mc-letter { color: var(--green); border-color: var(--green); }
.mc-opt.wrong { border-color: var(--red); background: var(--red-dim); color: var(--t0); }
.mc-opt.wrong .mc-letter { color: var(--red); border-color: var(--red); }
.mc-opt.dim { opacity: .55; }
.tf-row { display: flex; gap: 10px; margin-bottom: 16px; }
.tf-opt {
  flex: 1; padding: 12px; font-size: 14px; font-weight: 700;
  background: var(--bg1); border: 1px solid var(--line); border-radius: var(--radius-sm); cursor: pointer;
}
.tf-opt:hover { border-color: var(--line2); }
.tf-opt.selected-true { border-color: var(--green); background: var(--green-dim); color: var(--green); }
.tf-opt.selected-false { border-color: var(--red); background: var(--red-dim); color: var(--red); }
.input-row { margin-bottom: 14px; }
.input-row input[type=text], .input-row input:not([type]) {
  width: 100%; background: var(--bg1); border: 1px solid var(--line2); border-radius: var(--radius-sm);
  padding: 9px 12px; color: var(--t0);
}
.input-row input:focus, .input-row textarea:focus, .term-input textarea:focus { outline: none; border-color: var(--blue); }
.term-input { margin-bottom: 10px; }
.term-input textarea, .free-input textarea {
  width: 100%; background: var(--term-bg); color: var(--cyan);
  border: 1px solid var(--term-line); border-radius: var(--radius-sm);
  padding: 11px 12px; font-family: var(--mono); font-size: 13px; line-height: 1.6;
  resize: vertical; min-height: 86px; caret-color: var(--green);
}
.free-input textarea { color: var(--t0); }
.term-hint { font-size: 11.5px; color: var(--t3); margin: 5px 2px 0; font-family: var(--mono); }
.reveal-row { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
.reveal-block { margin-top: 16px; animation: fadeIn .18s ease; }

/* ============================================================
   10. TERMINAL / CODE BLOCK
   ============================================================ */
.terminal {
  background: var(--term-bg); border: 1px solid var(--term-line); border-radius: var(--radius-sm);
  margin: 6px 0 12px; overflow: hidden;
}
.terminal-head {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg1); border-bottom: 1px solid var(--term-line);
  padding: 5px 10px;
}
.term-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line2); }
.term-dot:first-child { background: var(--red); opacity: .8; }
.term-dot:nth-child(2) { background: var(--amber); opacity: .8; }
.term-dot:nth-child(3) { background: var(--green); opacity: .8; }
.terminal-title { font-family: var(--mono); font-size: 10.5px; color: var(--t3); margin-left: 6px; flex: 1; }
.copy-btn {
  font-family: var(--mono); font-size: 10.5px; color: var(--t2);
  background: transparent; border: 1px solid var(--line); border-radius: 4px;
  padding: 1px 8px; cursor: pointer;
}
.copy-btn:hover { color: var(--green); border-color: var(--green); }
.terminal-body {
  padding: 10px 12px; overflow-x: auto;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.65; color: var(--t1);
  white-space: pre; margin: 0;
}
.terminal-body .prompt { color: var(--green); font-weight: 700; }
.terminal-body .cmd { color: var(--t0); }

/* ============================================================
   11. REVEAL / VERDICT / RATING
   ============================================================ */
.verdict {
  display: inline-flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 13px;
  border-radius: var(--radius-sm); padding: 6px 14px; margin-bottom: 14px;
}
.verdict.ok { background: var(--green-dim); color: var(--green); }
.verdict.no { background: var(--red-dim); color: var(--red); }
.verdict.part { background: var(--amber-dim); color: var(--amber); }
.answer-box { margin-bottom: 14px; }
.answer-box h4 { margin-bottom: 6px; }
.answer-box pre {
  margin: 0; white-space: pre-wrap; word-break: break-word;
  background: var(--bg1); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px 12px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6;
}
.answer-box.user pre { border-color: var(--line2); color: var(--t1); }
.answer-box.correct pre { color: var(--t0); }
.explanation-box { margin-bottom: 14px; }
.explanation-box p { margin: 0; font-size: 13.5px; color: var(--t1); line-height: 1.65; }
.hints-box { margin-bottom: 14px; }
.hints-box ul { margin: 8px 0 0; padding-left: 18px; color: var(--t1); font-size: 13px; }
.hints-box li { margin-bottom: 4px; }
.refs-box { margin-bottom: 14px; }
.refs-box ul { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--t2); }
.cmd-compare { font-size: 12.5px; margin-bottom: 12px; }
.cmd-compare .cm-missing { color: var(--red); }
.cmd-compare .cm-extra { color: var(--amber); }
.rating-row {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  padding-top: 14px; border-top: 1px solid var(--line);
}
.rating-btn {
  flex: 1; min-width: 110px; padding: 11px 10px;
  border-radius: var(--radius-sm); border: 1px solid; cursor: pointer;
  font-weight: 700; font-size: 13.5px; text-align: center;
  transition: transform .05s;
}
.rating-btn:active { transform: translateY(1px); }
.rating-btn .rb-sub { display: block; font-weight: 500; font-size: 11px; opacity: .75; margin-top: 2px; }
.rating-again { background: var(--red-dim); border-color: var(--red); color: var(--red); }
.rating-hard { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }
.rating-good { background: var(--blue-dim); border-color: var(--blue); color: var(--blue); }
.rating-easy { background: var(--green-dim); border-color: var(--green); color: var(--green); }
.rating-btn:hover { filter: brightness(1.15); }

/* ============================================================
   12. SESSION
   ============================================================ */
.session-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
.session-count { font-family: var(--mono); font-size: 14px; color: var(--t0); font-weight: 700; }
.session-count .sc-total { color: var(--t2); font-weight: 400; }
.session-mode { font-size: 12px; color: var(--t2); font-family: var(--mono); }
.session-top .grow { flex: 1; }
.session-bar { height: 4px; background: var(--bg1); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
.session-bar .bar-fill { height: 100%; }
.session-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 16px 0; }
.summary-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.missed-list { margin-top: 16px; max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); }
.missed-item { padding: 8px 12px; font-size: 12.5px; border-bottom: 1px solid var(--line); color: var(--t1); cursor: pointer; }
.missed-item:last-child { border-bottom: none; }
.missed-item:hover { background: var(--bg1); }
.missed-item .mi-qid { font-family: var(--mono); color: var(--red); margin-right: 8px; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--t2); }
.empty-state .es-icon { font-size: 30px; margin-bottom: 8px; color: var(--t3); }
.empty-state .es-title { font-weight: 700; color: var(--t1); font-size: 14px; margin-bottom: 4px; }

/* ============================================================
   13. EXAM
   ============================================================ */
.exam-head {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 11px 16px; margin-bottom: 14px;
}
.exam-head .eh-item { display: flex; flex-direction: column; }
.exam-head .eh-label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--t2); }
.exam-head .eh-value { font-family: var(--mono); font-size: 15px; font-weight: 700; }
.exam-head .timer { color: var(--blue); }
.exam-head .timer.urgent { color: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
.palette { display: flex; gap: 6px; flex-wrap: wrap; }
.palette .p-cell {
  width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 12px; cursor: pointer;
  background: var(--bg1); border: 1px solid var(--line); border-radius: var(--radius-sm);
  color: var(--t1);
}
.palette .p-cell.current { border-color: var(--blue); color: var(--blue); }
.palette .p-cell.answered { background: var(--green-dim); color: var(--green); border-color: var(--green-dim); }
.palette .p-cell.marked { box-shadow: 0 0 0 2px var(--amber); }
.palette .p-cell:hover { border-color: var(--line2); }
.exam-foot { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
.score-ring {
  width: 150px; height: 150px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: conic-gradient(var(--green) calc(var(--score) * 1%), var(--bg1) 0);
  position: relative; margin: 0 auto 10px;
}
.score-ring::before { content: ""; position: absolute; inset: 10px; background: var(--card); border-radius: 50%; }
.score-ring .score-val { position: relative; font-family: var(--mono); font-size: 34px; font-weight: 700; }
.score-ring .score-sub { position: relative; font-size: 11px; color: var(--t2); text-transform: uppercase; letter-spacing: .08em; }
.weak-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.weak-chip {
  font-size: 12px; padding: 5px 12px; border-radius: 999px;
  background: var(--red-dim); border: 1px solid var(--red); color: var(--red); font-weight: 600;
}
.exam-review-item { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px; }
.exam-review-item .eri-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.exam-review-item .eri-q { font-size: 13.5px; font-weight: 600; margin-bottom: 8px; }
.exam-review-item .eri-body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .exam-review-item .eri-body { grid-template-columns: 1fr; } }
.exam-review-item .eri-ans { font-size: 12.5px; }
.exam-review-item .eri-ans .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--t2); font-weight: 700; display: block; margin-bottom: 3px; }
.exam-review-item .eri-ans pre { margin: 0; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; background: var(--bg1); border-radius: 4px; padding: 7px 9px; border: 1px solid var(--line); }
.flag-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--t1); cursor: pointer; user-select: none; }
.flag-toggle .flag-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bg1); border: 1px solid var(--line2); }
.flag-toggle.on .flag-dot { background: var(--amber); border-color: var(--amber); }

/* ============================================================
   14. WEAK TOPICS / PROGRESS
   ============================================================ */
.weak-list { display: flex; flex-direction: column; gap: 10px; }
.weak-item {
  display: flex; align-items: center; gap: 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px;
}
.weak-item .wi-info { flex: 1; min-width: 0; }
.weak-item .wi-name { font-weight: 700; font-size: 13.5px; }
.weak-item .wi-sub { font-size: 12px; color: var(--t2); font-family: var(--mono); }
.weak-item .wi-stats { text-align: right; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.weak-item .wi-stats .acc { font-size: 18px; font-weight: 700; }
.weak-item .wi-stats .acc.bad { color: var(--red); }
.weak-item .wi-stats .acc.warn { color: var(--amber); }
.weak-item .wi-stats .acc.ok { color: var(--green); }
.weak-item .wi-stats .att { color: var(--t2); font-size: 11px; }
.activity-chart { display: flex; align-items: flex-end; gap: 5px; height: 120px; padding: 10px 4px 0; }
.activity-chart .ac-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.activity-chart .ac-bar-wrap { width: 100%; height: 90px; display: flex; align-items: flex-end; }
.activity-chart .ac-bar { width: 100%; background: linear-gradient(180deg, var(--blue), var(--blue-dim)); border-radius: 3px 3px 0 0; min-height: 2px; }
.activity-chart .ac-bar.correct { background: linear-gradient(180deg, var(--green), var(--green-dim)); }
.activity-chart .ac-label { font-family: var(--mono); font-size: 9.5px; color: var(--t3); }
.legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--t2); margin-top: 6px; }
.legend .lg { display: inline-flex; align-items: center; gap: 5px; }
.legend .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* ============================================================
   15. FILTERS / SEARCH / BROWSE
   ============================================================ */
.filter-bar {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  background: var(--card2); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; margin-bottom: 14px;
}
.filter-bar .fb-field { display: flex; flex-direction: column; gap: 3px; }
.filter-bar .fb-label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--t2); font-weight: 700; }
.filter-bar select, .filter-bar input {
  background: var(--bg1); border: 1px solid var(--line2); border-radius: var(--radius-sm);
  padding: 5px 8px; font-size: 12.5px; color: var(--t0); max-width: 170px;
}
.search-box { position: relative; flex: 1; min-width: 220px; }
.search-box input { width: 100%; padding: 8px 12px 8px 32px; font-size: 13.5px; }
.search-box .search-glyph { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--t3); font-size: 13px; }
.qlist-item { border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 8px; overflow: hidden; }
.qlist-item .qli-head {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; font-size: 13px;
}
.qlist-item .qli-head:hover { background: var(--bg1); }
.qlist-item .qli-q { flex: 1; color: var(--t0); font-weight: 500; }
.qlist-item .qli-body { padding: 0 12px 12px; }
.search-group { margin-bottom: 18px; }
.search-group .sg-head { font-size: 12.5px; color: var(--t2); margin-bottom: 8px; font-family: var(--mono); }
.search-group .sg-head b { color: var(--t0); }
.tag-filter { display: flex; gap: 6px; flex-wrap: wrap; }
.tag-chip {
  font-family: var(--mono); font-size: 11px; cursor: pointer; user-select: none;
  color: var(--t2); background: var(--bg1); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
}
.tag-chip.on { color: var(--cyan); border-color: var(--cyan-dim); background: var(--cyan-dim); }
.tag-chip:hover { border-color: var(--line2); }

/* ============================================================
   16. SETTINGS
   ============================================================ */
.settings-section { margin-bottom: 18px; }
.setting-row {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 11px 0; border-bottom: 1px solid var(--line);
}
.setting-row:last-child { border-bottom: none; }
.setting-row .sr-info { font-size: 13px; }
.setting-row .sr-info .sr-desc { font-size: 11.5px; color: var(--t2); margin-top: 2px; }
.switch { position: relative; width: 40px; height: 22px; flex: 0 0 40px; cursor: pointer; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider {
  position: absolute; inset: 0; border-radius: 999px;
  background: var(--bg1); border: 1px solid var(--line2); transition: background .15s;
}
.switch .slider::before {
  content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
  left: 2px; top: 2px; background: var(--t2); transition: transform .15s, background .15s;
}
.switch input:checked + .slider { background: var(--green-dim); border-color: var(--green); }
.switch input:checked + .slider::before { transform: translateX(18px); background: var(--green); }
.data-source-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 12.5px; font-family: var(--mono); }
.data-source-row .ds-status { margin-left: auto; }
.ds-status .ok { color: var(--green); }
.ds-status .err { color: var(--red); }
.ds-err { font-size: 11px; color: var(--red); font-family: var(--mono); word-break: break-all; }

/* ============================================================
   17. MODAL / TOAST / LOADING / NOTICES
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(4, 8, 14, .66);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: fadeIn .15s ease;
}
.modal-card {
  background: var(--card); border: 1px solid var(--line2); border-radius: var(--radius);
  max-width: 460px; width: 100%; padding: 20px; box-shadow: var(--shadow);
}
.modal-card h3 { margin-bottom: 8px; }
.modal-card p { color: var(--t1); font-size: 13px; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.toast-host { position: fixed; right: 18px; bottom: 18px; z-index: 120; display: flex; flex-direction: column; gap: 8px; max-width: 340px; }
.toast {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--card2); border: 1px solid var(--line2); border-left: 3px solid var(--blue);
  border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12.5px; color: var(--t0);
  box-shadow: var(--shadow); animation: slideIn .18s ease;
}
.toast.ok { border-left-color: var(--green); }
.toast.err { border-left-color: var(--red); }
.toast.warn { border-left-color: var(--amber); }
@keyframes slideIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.load-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; }
.spinner {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid var(--line2); border-top-color: var(--green);
  animation: spin .8s linear infinite; margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.notice { border: 1px solid; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12.5px; margin-bottom: 14px; }
.notice.warn { border-color: var(--amber-dim); background: var(--amber-dim); color: var(--amber); }
.notice.err { border-color: var(--red-dim); background: var(--red-dim); color: var(--red); }
.notice.ok { border-color: var(--green-dim); background: var(--green-dim); color: var(--green); }
.notice.info { border-color: var(--blue-dim); background: var(--blue-dim); color: var(--blue); }
.error-box { text-align: left; font-size: 12px; color: var(--red); }
.error-box div { padding: 3px 0; font-family: var(--mono); }

/* ============================================================
   18. RESPONSIVE
   ============================================================ */
@media (max-width: 980px) {
  .sidebar { transform: translateX(-100%); box-shadow: var(--shadow); }
  .sidebar.open { transform: none; }
  .sidebar-close { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-left: auto; }
  .sidebar-overlay.show { display: block; }
  .main { margin-left: 0; padding: 18px 16px 60px; }
  .topbar { display: flex; }
  .bar-row .bar-label { width: 120px; flex-basis: 120px; }
}
@media (max-width: 520px) {
  .stat-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .rating-row { flex-direction: column; }
  .rating-btn { min-width: 0; }
  .page-head h1 { font-size: 18px; }
  .chapter-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<body>
<noscript><div style="padding:40px; text-align:center; font-family: sans-serif">Networking Recall requires JavaScript. Please enable it and reload.</div></noscript>

<div id="app" v-cloak>

  <template v-if="$G.store.vueError">
    <div class="load-page" style="min-height:100vh">
      <div class="es-icon">&#9888;</div>
      <h2>Vue.js could not be loaded</h2>
      <p class="muted">This application needs the Vue 3 library (loaded from a CDN). Check your internet connection, then retry.</p>
      <button class="btn btn-primary" @click="$G.UI.reload()">Retry</button>
    </div>
  </template>

  <template v-else-if="!$G.store.appReady">
    <div class="load-page">
      <div class="spinner"></div>
      <h2>Loading question banks...</h2>
      <p class="muted">Networking Recall</p>

      <div class="notice warn" v-if="$G.store.fileProtocol" style="max-width:560px; text-align:left">
        <b>Opening from the filesystem (file://).</b> Some browsers block fetch() of local JSON files, which prevents the
        question banks from loading. This application works best served over HTTP or inside an Obsidian web-view. Options:
        <div style="font-family:var(--mono); margin-top:8px; font-size:11.5px; line-height:1.8">
          &#8226; From a terminal: <code>python3 -m http.server 8000</code> in this folder, then open
          <code>http://localhost:8000/index.html</code><br>
          &#8226; In Obsidian: use a web-view plugin (e.g. &#8220;HTML&#8221; by jjspace) to open this file<br>
          &#8226; Or use Firefox, which permits local file fetch() by default
        </div>
      </div>

      <div class="card" style="text-align:left; min-width:300px; max-width:560px" v-if="$G.store.loadErrors.length || $G.store.validationErrors.length">
        <div class="card-title">
          <h3>Data loading report</h3>
          <button class="btn btn-sm btn-ghost" @click="$G.DataStore.loadAll()">Retry load</button>
        </div>
        <div class="notice err" v-if="$G.store.loadErrors.length">
          <b>Failed to load {{ $G.store.loadErrors.length }} file(s):</b>
          <div class="error-box">
            <div v-for="e in $G.store.loadErrors" :key="e.file">&#8226; {{ e.file }} — {{ e.message }}</div>
          </div>
        </div>
        <div class="notice warn" v-if="$G.store.validationErrors.length">
          <b>Validation issues in {{ $G.store.validationErrors.length }} question(s):</b>
          <div class="error-box" style="color:var(--amber)">
            <div v-for="(v, i) in $G.store.validationErrors.slice(0, 12)" :key="i">
              &#8226; [{{ v.file }}] {{ v.questionId || v.file }}: {{ v.problem }}
            </div>
            <div v-if="$G.store.validationErrors.length > 12" class="muted">... and {{ $G.store.validationErrors.length - 12 }} more</div>
          </div>
        </div>
        <div class="notice info" v-if="$G.store.loadErrors.length && $G.store.questions.length">
          <b>{{ $G.store.questions.length }} questions loaded</b> from the other files — the application is usable.
        </div>
      </div>
    </div>
  </template>

  <template v-else>
    <header class="topbar">
      <button class="hamburger" @click="$G.UI.toggleSidebar()">&#9776;</button>
      <div class="brand-name">NETWORKING RECALL</div>
      <span class="badge bad" style="margin-left:auto" v-if="$G.store.dueCount() > 0">{{ $G.store.dueCount() }} due</span>
    </header>
    <div class="sidebar-overlay" :class="{show: $G.store.ui.sidebarOpen}" @click="$G.UI.toggleSidebar(false)"></div>
    <aside class="sidebar" :class="{open: $G.store.ui.sidebarOpen}">
      <div class="brand">
        <div class="brand-mark">NR</div>
        <div>
          <div class="brand-name">NETWORKING RECALL</div>
          <div class="brand-sub">active recall &middot; spaced repetition</div>
        </div>
        <button class="sidebar-close" @click="$G.UI.toggleSidebar(false)">&#10005;</button>
      </div>
      <nav>
        <div class="nav-item" v-for="item in $G.NAV" :key="item.view"
             :class="{active: $G.store.view === item.view}"
             @click="$G.UI.go(item.view)">
          <span class="nav-icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
          <span class="nav-badge" v-if="item.view === 'review' && $G.store.dueCount() > 0">{{ $G.store.dueCount() }}</span>
        </div>
      </nav>
      <div class="sidebar-foot">
        <div>{{ $G.store.questions.length }} questions &middot; {{ $G.store.chapters.length }} chapters</div>
        <div>streak {{ $G.Stats.streak().current }}d &middot; {{ $G.Storage.state.settings.theme }} theme</div>
      </div>
    </aside>

    <main class="main">
      <dashboard-view v-show="$G.store.view === 'dashboard'"></dashboard-view>
      <chapters-view v-show="$G.store.view === 'chapters'"></chapters-view>
      <topics-view v-show="$G.store.view === 'topics'"></topics-view>
      <review-view v-show="$G.store.view === 'review'"></review-view>
      <random-view v-show="$G.store.view === 'random'"></random-view>
      <exam-view v-show="$G.store.view === 'exam'"></exam-view>
      <trouble-view v-show="$G.store.view === 'trouble'"></trouble-view>
      <weak-view v-show="$G.store.view === 'weak'"></weak-view>
      <progress-view v-show="$G.store.view === 'progress'"></progress-view>
      <browse-view v-show="$G.store.view === 'browse'"></browse-view>
      <search-view v-show="$G.store.view === 'search'"></search-view>
      <settings-view v-show="$G.store.view === 'settings'"></settings-view>
    </main>
  </template>

  <confirm-modal></confirm-modal>
  <toast-host></toast-host>
</div>

<script>
/* ============================================================
   NETWORKING RECALL
   1. Configuration      2. Utilities            3. Storage
   4. Data loading       5. Validation           6. Normalization
   7. Progress           8. Spaced repetition    9. Answer evaluation
   10. Filters & search  11. Statistics          12. UI helpers
   13. Session engine    14. Random mode         15. Exam engine
   16. Troubleshooting   17. Vue application     18. Initialisation
   ============================================================ */
'use strict';

/* ============================================================
   1. CONFIGURATION
   ============================================================ */
const APP = {
  name: 'Networking Recall',
  storageKey: 'networking-recall-v1',
  version: '1.0.0',
  questionFiles: [
    { path: './data/fundamentals.json', chapterId: 'fundamentals' },
    { path: './data/switching.json',    chapterId: 'switching' },
    { path: './data/routing.json',      chapterId: 'routing' },
    { path: './data/ospf.json',         chapterId: 'ospf' },
    { path: './data/eigrp.json',        chapterId: 'eigrp' },
    { path: './data/security.json',     chapterId: 'security' },
    { path: './data/services.json',     chapterId: 'services' }
  ],
  questionTypes: [
    'recall', 'multiple_choice', 'true_false', 'fill_blank', 'command',
    'configuration', 'troubleshooting', 'scenario', 'compare', 'explain',
    'packet_flow', 'show_command'
  ],
  difficulties: ['easy', 'medium', 'hard'],
  sr: {
    againMinutes: 10,
    hardDays: 1,
    goodDays: [3, 7, 14, 30, 60],
    easyDays: [7, 21, 45, 90]
  },
  defaultSettings: {
    theme: 'dark',
    queueCap: 30,
    showHints: true,
    tokenThreshold: 0.66,
    weakMinAttempts: 2,
    weakMinAccuracy: 70
  },
  typeLabels: {
    recall: 'Recall',
    multiple_choice: 'Multiple Choice',
    true_false: 'True / False',
    fill_blank: 'Fill Blank',
    command: 'Command',
    configuration: 'Configuration',
    troubleshooting: 'Troubleshooting',
    scenario: 'Scenario',
    compare: 'Compare',
    explain: 'Explain',
    packet_flow: 'Packet Flow',
    show_command: 'Show Command'
  },
  diffLabels: { easy: 'Easy', medium: 'Medium', hard: 'Hard' }
};

/* ============================================================
   2. UTILITIES
   ============================================================ */
const U = {
  todayStr(d) {
    const dt = d || new Date();
    return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
  },
  endOfToday() {
    const d = new Date();
    d.setHours(23, 59, 59, 999);
    return d;
  },
  fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return isNaN(d.getTime()) ? iso : d.toLocaleDateString();
  },
  fmtTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return isNaN(d.getTime()) ? iso : d.toLocaleString();
  },
  fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    const mm = String(m).padStart(2, '0');
    const ss = String(s).padStart(2, '0');
    return h ? h + ':' + mm + ':' + ss : mm + ':' + ss;
  },
  pct(part, total) {
    return total ? Math.round((part / total) * 100) : 0;
  },
  num(v, def) {
    const d = def === undefined ? 0 : def;
    return typeof v === 'number' && isFinite(v) ? v : d;
  },
  cap(s) {
    return typeof s === 'string' ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  },
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  },
  pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }
};

/* ============================================================
   3. STORAGE (localStorage, namespaced, corruption-safe)
   ============================================================ */
const Storage = {
  state: null,

  freshState() {
    return {
      progress: {},
      meta: { created: U.todayStr(), updated: U.todayStr(), sessions: [], activity: {} },
      settings: JSON.parse(JSON.stringify(APP.defaultSettings))
    };
  },

  sanitizeRecord(raw) {
    const rec = {
      attempts: 0, correct: 0, incorrect: 0, lastReviewed: null, nextReview: null,
      interval: 0, ease: 2.5, srLevel: 0, lastRating: null, firstSeen: U.todayStr()
    };
    if (raw && typeof raw === 'object') {
      rec.attempts = U.num(raw.attempts);
      rec.correct = U.num(raw.correct);
      rec.incorrect = U.num(raw.incorrect);
      if (typeof raw.lastReviewed === 'string') rec.lastReviewed = raw.lastReviewed;
      if (typeof raw.nextReview === 'string' && !isNaN(Date.parse(raw.nextReview))) rec.nextReview = raw.nextReview;
      rec.interval = U.num(raw.interval);
      if (typeof raw.ease === 'number' && isFinite(raw.ease)) rec.ease = Math.min(3, Math.max(1.3, raw.ease));
      rec.srLevel = U.num(raw.srLevel);
      if (['again', 'hard', 'good', 'easy'].indexOf(raw.lastRating) !== -1) rec.lastRating = raw.lastRating;
      if (typeof raw.firstSeen === 'string') rec.firstSeen = raw.firstSeen;
    }
    return rec;
  },

  load() {
    const defaults = Storage.freshState();
    let raw = null;
    try {
      raw = localStorage.getItem(APP.storageKey);
    } catch (e) {
      Storage.state = defaults;
      return defaults;
    }
    if (!raw) { Storage.state = defaults; return defaults; }
    try {
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('bad root shape');
      const state = Storage.freshState();
      if (parsed.progress && typeof parsed.progress === 'object') {
        Object.keys(parsed.progress).forEach((qid) => {
          state.progress[qid] = Storage.sanitizeRecord(parsed.progress[qid]);
        });
      }
      if (parsed.meta && typeof parsed.meta === 'object') {
        if (typeof parsed.meta.created === 'string') state.meta.created = parsed.meta.created;
        if (typeof parsed.meta.updated === 'string') state.meta.updated = parsed.meta.updated;
        if (Array.isArray(parsed.meta.sessions)) {
          state.meta.sessions = parsed.meta.sessions.filter((s) => s && typeof s === 'object').slice(-300);
        }
        if (parsed.meta.activity && typeof parsed.meta.activity === 'object') {
          Object.keys(parsed.meta.activity).forEach((k) => {
            const a = parsed.meta.activity[k];
            if (a && typeof a === 'object' && /^\d{4}-\d{2}-\d{2}$/.test(k)) {
              state.meta.activity[k] = { attempts: U.num(a.attempts), correct: U.num(a.correct) };
            }
          });
        }
      }
      if (parsed.settings && typeof parsed.settings === 'object') {
        Object.keys(APP.defaultSettings).forEach((key) => {
          if (parsed.settings[key] !== undefined) state.settings[key] = parsed.settings[key];
        });
        if (['dark', 'light'].indexOf(state.settings.theme) === -1) state.settings.theme = 'dark';
      }
      Storage.state = state;
      return state;
    } catch (err) {
      try { localStorage.setItem(APP.storageKey + '-corrupt', String(raw)); } catch (e) { /* ignore */ }
      Storage.state = defaults;
      return defaults;
    }
  },

  save() {
    try {
      Storage.state.meta.updated = U.todayStr();
      localStorage.setItem(APP.storageKey, JSON.stringify(Storage.state));
    } catch (err) {
      const ui = typeof UI !== 'undefined' ? UI : null;
      if (ui) ui.toast('Could not save to localStorage (storage full?)', 'err');
    }
  },

  reset() {
    Storage.state = Storage.freshState();
    Storage.save();
  },

  pruneActivity() {
    const cutoff = U.todayStr(new Date(Date.now() - 90 * 86400000));
    Object.keys(Storage.state.meta.activity).forEach((k) => {
      if (k < cutoff) delete Storage.state.meta.activity[k];
    });
  },

  exportJson() {
    return {
      app: APP.name,
      version: APP.version,
      exportedAt: new Date().toISOString(),
      progress: Storage.state.progress,
      meta: Storage.state.meta,
      settings: Storage.state.settings
    };
  },

  importData(data, mode) {
    const count = 0;
    if (mode === 'replace') Storage.state.progress = {};
    if (data && data.progress && typeof data.progress === 'object') {
      Object.keys(data.progress).forEach((qid) => {
        Storage.state.progress[qid] = Storage.sanitizeRecord(data.progress[qid]);
      });
    }
    if (data && data.meta && typeof data.meta === 'object') {
      if (Array.isArray(data.meta.sessions)) {
        Storage.state.meta.sessions = Storage.state.meta.sessions.concat(data.meta.sessions).slice(-300);
      }
      if (data.meta.activity && typeof data.meta.activity === 'object') {
        Object.keys(data.meta.activity).forEach((k) => {
          const a = data.meta.activity[k];
          if (!a || typeof a !== 'object') return;
          const cur = Storage.state.meta.activity[k] || { attempts: 0, correct: 0 };
          cur.attempts += U.num(a.attempts);
          cur.correct += U.num(a.correct);
          Storage.state.meta.activity[k] = cur;
        });
      }
    }
    if (data && data.settings && typeof data.settings === 'object') {
      Object.keys(APP.defaultSettings).forEach((key) => {
        if (data.settings[key] !== undefined) Storage.state.settings[key] = data.settings[key];
      });
    }
    Storage.save();
    return { count: Object.keys(Storage.state.progress).length };
  }
};

/* ============================================================
   6. NORMALIZATION (flat internal question records)
   ============================================================ */
function normalizeQuestion(raw, ch, top, sub) {
  const answerText = Array.isArray(raw.answer) ? raw.answer.join('\n') : String(raw.answer == null ? '' : raw.answer);
  return {
    id: raw.id,
    type: raw.type,
    difficulty: raw.difficulty,
    question: raw.question,
    answer: raw.answer,
    answerText: answerText,
    explanation: typeof raw.explanation === 'string' ? raw.explanation : '',
    tags: Array.isArray(raw.tags) ? raw.tags : [],
    choices: Array.isArray(raw.choices) ? raw.choices : [],
    acceptableAnswers: Array.isArray(raw.acceptableAnswers) ? raw.acceptableAnswers : [],
    commands: Array.isArray(raw.commands) ? raw.commands : [],
    expectedOutput: typeof raw.expectedOutput === 'string' ? raw.expectedOutput : '',
    hints: Array.isArray(raw.hints) ? raw.hints : [],
    references: Array.isArray(raw.references) ? raw.references : [],
    relatedQuestions: Array.isArray(raw.relatedQuestions) ? raw.relatedQuestions : [],
    symptoms: Array.isArray(raw.symptoms) ? raw.symptoms : [],
    topology: typeof raw.topology === 'string' ? raw.topology : '',
    showOutput: typeof raw.showOutput === 'string' ? raw.showOutput : '',
    config: typeof raw.config === 'string' ? raw.config : '',
    chapterId: ch.id,
    chapterName: ch.name,
    topicId: top.id,
    topicName: top.name,
    subtopicId: sub.id,
    subtopicName: sub.name,
    hasScenario: !!((raw.symptoms && raw.symptoms.length) || raw.topology || raw.showOutput || raw.config)
  };
}

/* ============================================================
   5. VALIDATION
   ============================================================ */
const Validator = {
  validateFile(file, data, seenIds) {
    const errors = [];
    const chapters = [];
    const err = (questionId, problem) => errors.push({ file, questionId, problem });

    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      err(null, 'File root is not a JSON object');
      return { errors, chapters };
    }
    const ch = data.chapter;
    if (!ch || typeof ch !== 'object') {
      err(null, 'Missing "chapter" object');
      return { errors, chapters };
    }
    if (typeof ch.id !== 'string' || !ch.id.trim()) err(null, 'Chapter is missing a non-empty "id"');
    if (typeof ch.name !== 'string' || !ch.name.trim()) err(null, 'Chapter is missing a non-empty "name"');
    if (!Array.isArray(data.topics)) {
      err(null, 'Missing "topics" array');
      return { errors, chapters };
    }

    const chapter = { chapter: { id: ch.id, name: ch.name, description: ch.description || '' }, topics: [] };

    data.topics.forEach((t, ti) => {
      const tname = (t && (t.name || t.id)) || '(topic at index ' + ti + ')';
      if (!t || typeof t !== 'object') { err(null, 'Topic at index ' + ti + ' is not an object'); return; }
      if (!t.id) err(null, 'Topic "' + tname + '" is missing "id"');
      if (!t.name) err(null, 'Topic "' + t.id + '" is missing "name"');

      let subs = Array.isArray(t.subtopics) ? t.subtopics : null;
      if (!subs && Array.isArray(t.questions)) {
        subs = [{ id: t.id || 'general', name: t.name || 'General', questions: t.questions }];
      }
      if (!subs) { err(null, 'Topic "' + tname + '" has neither "subtopics" nor "questions"'); return; }

      const topic = { id: t.id || tname, name: t.name || tname, subtopics: [] };
      subs.forEach((s, si) => {
        const sname = (s && (s.name || s.id)) || '(subtopic at index ' + si + ')';
        if (!s || typeof s !== 'object') { err(null, 'Subtopic at index ' + si + ' of "' + tname + '" is not an object'); return; }
        if (!s.id) err(null, 'Subtopic "' + sname + '" of "' + tname + '" is missing "id"');
        if (!s.name) err(null, 'Subtopic "' + s.id + '" of "' + tname + '" is missing "name"');
        if (!Array.isArray(s.questions)) { err(null, 'Subtopic "' + sname + '" has no "questions" array'); return; }

        const subtopic = { id: s.id || sname, name: s.name || sname, questions: [] };
        s.questions.forEach((q, qi) => {
          const qid = (q && q.id) || '(question at index ' + qi + ')';
          if (!q || typeof q !== 'object') { err(qid, 'Question is not an object'); return; }
          if (typeof q.id !== 'string' || !q.id.trim()) { err(qid, 'Missing "id" — skipped'); return; }
          if (seenIds.has(q.id)) { err(q.id, 'Duplicate question ID — skipped'); return; }
          seenIds.add(q.id);
          if (APP.questionTypes.indexOf(q.type) === -1) { err(q.id, 'Invalid type "' + q.type + '" — skipped'); return; }
          if (APP.difficulties.indexOf(q.difficulty) === -1) { err(q.id, 'Invalid difficulty "' + q.difficulty + '" — skipped'); return; }
          if (typeof q.question !== 'string' || !q.question.trim()) { err(q.id, 'Missing "question" text — skipped'); return; }
          if (q.type === 'multiple_choice') {
            if (!Array.isArray(q.choices) || q.choices.length < 2) { err(q.id, 'Multiple-choice question needs at least 2 choices — skipped'); return; }
            if (!q.choices.some((c) => typeof c === 'string' && Evaluator.normalize(c) === Evaluator.normalize(q.answer))) {
              err(q.id, 'Answer is not one of the choices — skipped'); return;
            }
          }
          if (!q.answer && q.answer !== 0 && q.answer !== false) { err(q.id, 'Missing "answer" — skipped'); return; }
          if (typeof q.explanation !== 'string' || !q.explanation.trim()) {
            err(q.id, 'Missing "explanation" (question loaded without one)');
          }
          if (!Array.isArray(q.tags)) err(q.id, 'Missing "tags" array (defaulted to [])');
          subtopic.questions.push(normalizeQuestion(q, chapter.chapter, topic, subtopic));
        });

        if (subtopic.questions.length) topic.subtopics.push(subtopic);
        else if (s.questions.length) err(null, 'Subtopic "' + sname + '" of "' + tname + '" has no loadable questions');
      });
      if (topic.subtopics.length) chapter.topics.push(topic);
      else err(null, 'Topic "' + tname + '" has no loadable questions');
    });

    if (chapter.topics.length) chapters.push(chapter);
    return { errors, chapters };
  }
};

/* ============================================================
   4. DATA LOADING (fetch all JSON banks, keep going on failure)
   ============================================================ */
const DataStore = {
  chapters: [],
  questions: [],
  byId: {},
  searchIndex: {},
  allTags: [],
  chapterCounts: {},
  loadErrors: [],
  validationErrors: [],
  fileStatus: {},

  async loadAll() {
    DataStore.loadErrors = [];
    DataStore.validationErrors = [];
    DataStore.fileStatus = {};
    const jobs = APP.questionFiles.map((f) =>
      fetch(f.path, { cache: 'no-cache' }).then((res) => {
        if (!res.ok) throw new Error('HTTP ' + res.status + (res.statusText ? ' ' + res.statusText : ''));
        return res.json();
      })
    );
    const results = await Promise.allSettled(jobs);
    const seenIds = new Set();
    const validChapters = [];
    APP.questionFiles.forEach((f, i) => {
      const res = results[i];
      if (res.status === 'rejected') {
        const message = (res.reason && res.reason.message) ? res.reason.message : String(res.reason);
        DataStore.loadErrors.push({ file: f.path, message });
        DataStore.fileStatus[f.path] = { state: 'error', message };
        return;
      }
      const out = Validator.validateFile(f.path, res.value, seenIds);
      DataStore.validationErrors.push(...out.errors);
      DataStore.fileStatus[f.path] = { state: 'ok', message: '' };
      validChapters.push(...out.chapters);
    });

    DataStore.chapters = validChapters;
    const flat = [];
    validChapters.forEach((c) => c.topics.forEach((t) => t.subtopics.forEach((s) => s.questions.forEach((q) => flat.push(q)))));
    DataStore.questions = flat;

    DataStore.byId = {};
    DataStore.searchIndex = {};
    const tagSet = new Set();
    DataStore.chapterCounts = {};
    flat.forEach((q) => {
      DataStore.byId[q.id] = q;
      const hay = [q.question, q.answerText, q.explanation, (q.tags || []).join(' '),
        q.chapterName, q.topicName, q.subtopicName, APP.typeLabels[q.type] || q.type].join(' ');
      DataStore.searchIndex[q.id] = Evaluator.normalize(hay);
      (q.tags || []).forEach((t) => tagSet.add(t));
      DataStore.chapterCounts[q.chapterId] = (DataStore.chapterCounts[q.chapterId] || 0) + 1;
    });
    DataStore.allTags = Array.from(tagSet).sort();

    store.loadErrors = DataStore.loadErrors;
    store.validationErrors = DataStore.validationErrors;
    store.fileStatus = DataStore.fileStatus;
    store.questions = DataStore.questions;
    store.chapters = DataStore.chapters;
    return { errors: DataStore.loadErrors.length, validations: DataStore.validationErrors.length };
  }
};

/* ============================================================
   7. PROGRESS
   ============================================================ */
const Progress = {
  get(qid) {
    return Storage.state.progress[qid] || null;
  },
  ensure(qid) {
    if (!Storage.state.progress[qid]) {
      Storage.state.progress[qid] = {
        attempts: 0, correct: 0, incorrect: 0, lastReviewed: null, nextReview: null,
        interval: 0, ease: 2.5, srLevel: 0, lastRating: null, firstSeen: U.todayStr()
      };
    }
    return Storage.state.progress[qid];
  },
  isAnswered(qid) {
    const r = Progress.get(qid);
    return !!(r && r.attempts > 0);
  },
  isDue(qid) {
    const r = Progress.get(qid);
    if (!r || !r.nextReview) return false;
    return Date.parse(r.nextReview) <= U.endOfToday().getTime();
  },
  isIncorrect(qid) {
    const r = Progress.get(qid);
    return !!(r && r.attempts > 0 && r.incorrect >= r.correct);
  },
  accuracyOf(qid) {
    const r = Progress.get(qid);
    return r && r.attempts ? Math.round((r.correct / r.attempts) * 100) : null;
  },
  dueQuestions() {
    const ids = [];
    DataStore.questions.forEach((q) => { if (Progress.isDue(q.id)) ids.push(q.id); });
    ids.sort((a, b) => {
      const ra = Progress.get(a), rb = Progress.get(b);
      return (ra ? Date.parse(ra.nextReview) : 0) - (rb ? Date.parse(rb.nextReview) : 0);
    });
    return ids;
  },
  recordAttempt(qid, correct, rating) {
    const rec = Progress.ensure(qid);
    rec.attempts += 1;
    if (correct) rec.correct += 1; else rec.incorrect += 1;
    rec.lastReviewed = U.todayStr();
    if (rating) {
      SR.schedule(rating, rec);
      rec.lastRating = rating;
    } else {
      rec.lastRating = null;
    }
    const today = U.todayStr();
    const act = Storage.state.meta.activity[today] || { attempts: 0, correct: 0 };
    act.attempts += 1;
    if (correct) act.correct += 1;
    Storage.state.meta.activity[today] = act;
    Storage.pruneActivity();
    Storage.save();
  },
  recordSession(mode, total, correct, durationMs) {
    Storage.state.meta.sessions.push({
      ts: new Date().toISOString(), mode: mode, total: total, correct: correct,
      duration: Math.round(durationMs || 0)
    });
    if (Storage.state.meta.sessions.length > 300) {
      Storage.state.meta.sessions = Storage.state.meta.sessions.slice(-300);
    }
    Storage.save();
  }
};

/* ============================================================
   8. SPACED REPETITION (Again / Hard / Good / Easy)
   ============================================================ */
const SR = {
  schedule(rating, rec) {
    const now = Date.now();
    if (rating === 'again') { rec.interval = APP.sr.againMinutes / 1440; rec.srLevel = 0; }
    else if (rating === 'hard') { rec.interval = APP.sr.hardDays; rec.srLevel = 0; }
    else if (rating === 'good') {
      rec.srLevel = Math.min((rec.srLevel || 0) + 1, APP.sr.goodDays.length - 1);
      rec.interval = APP.sr.goodDays[rec.srLevel];
    } else if (rating === 'easy') {
      rec.srLevel = Math.min((rec.srLevel || 0) + 1, APP.sr.easyDays.length - 1);
      rec.interval = APP.sr.easyDays[rec.srLevel];
    }
    if (rating === 'again') rec.ease = Math.max(1.3, (rec.ease || 2.5) - 0.2);
    else if (rating === 'hard') rec.ease = Math.max(1.3, (rec.ease || 2.5) - 0.1);
    else if (rating === 'good') rec.ease = Math.min(3.0, (rec.ease || 2.5) + 0.05);
    else if (rating === 'easy') rec.ease = Math.min(3.0, (rec.ease || 2.5) + 0.1);
    rec.nextReview = new Date(now + rec.interval * 86400000).toISOString();
    return rec;
  },
  previewInterval(rating, rec) {
    if (rating === 'again') return APP.sr.againMinutes / 1440;
    if (rating === 'hard') return APP.sr.hardDays;
    const lvl = rec ? Math.min(rec.srLevel || 0, APP.sr.goodDays.length - 1) : 0;
    if (rating === 'good') return APP.sr.goodDays[lvl];
    if (rating === 'easy') return APP.sr.easyDays[lvl];
    return 0;
  },
  intervalLabel(days) {
    if (days <= 0) return 'now';
    if (days < 1) return Math.round(days * 1440) + ' min';
    if (days < 30) return Math.round(days) + ' days';
    if (days < 365) return Math.round(days / 30) + ' months';
    return Math.round(days / 365) + ' years';
  }
};

/* ============================================================
   9. ANSWER EVALUATION (lenient, normalization-based)
   ============================================================ */
const Evaluator = {
  normalize(s) {
    return String(s == null ? '' : s)
      .toLowerCase()
      .replace(/[^\p{L}\p{N}]+/gu, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  },
  tokens(s) {
    return Evaluator.normalize(s).split(' ').filter(Boolean);
  },
  overlap(user, ref) {
    const u = Evaluator.tokens(user);
    const r = Evaluator.tokens(ref);
    if (!u.length || !r.length) return 0;
    const set = new Set(r);
    let hits = 0;
    for (const t of u) if (set.has(t)) hits++;
    return hits / r.length;
  },
  stripIosPrompt(line) {
    return String(line).replace(/^\s*[a-zA-Z0-9_.-]+(?:\([a-zA-Z0-9_.-]+\))?[#>]\s*/, '').trim();
  },
  normalizeCommand(line) {
    return Evaluator.stripIosPrompt(line)
      .toLowerCase()
      .replace(/[^\w./:?-]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  },
  commandTokens(cmd) {
    return Evaluator.normalizeCommand(cmd).split(' ').filter(Boolean);
  },
  tokenMatch(u, e) {
    if (u === e) return true;
    if (/^[0-9]/.test(e)) return false;
    return u.length >= 2 && e.startsWith(u);
  },
  commandMatches(userCmd, expCmd) {
    const u = Evaluator.commandTokens(userCmd);
    const e = Evaluator.commandTokens(expCmd);
    if (!u.length || !e.length || u.length !== e.length) return false;
    for (let i = 0; i < u.length; i++) {
      if (!Evaluator.tokenMatch(u[i], e[i])) return false;
    }
    return true;
  },
  splitCommands(text) {
    return String(text == null ? '' : text).split(/\r?\n/).map(Evaluator.normalizeCommand).filter(Boolean);
  },
  compareCommands(userText, expectedList) {
    const user = Evaluator.splitCommands(userText);
    const exp = (expectedList || []).map(Evaluator.normalizeCommand).filter(Boolean);
    if (!exp.length) return { matched: [], missing: [], extra: user, score: 0 };
    const matched = [];
    const missing = [];
    const extra = [];
    const used = new Set();
    for (const uc of user) {
      let hit = -1;
      for (let i = 0; i < exp.length; i++) {
        if (used.has(i)) continue;
        if (Evaluator.commandMatches(uc, exp[i])) { hit = i; break; }
      }
      if (hit >= 0) { matched.push(exp[hit]); used.add(hit); }
      else extra.push(uc);
    }
    exp.forEach((c, i) => { if (!used.has(i)) missing.push(c); });
    return { matched: matched, missing: missing, extra: extra, score: Math.round((matched.length / exp.length) * 100) };
  },
  commandCandidateLists(question) {
    const lists = [];
    if (question.commands && question.commands.length) lists.push(question.commands);
    else if (typeof question.answer === 'string' && question.answer.trim()) lists.push([question.answer]);
    else if (Array.isArray(question.answer)) lists.push(question.answer);
    (question.acceptableAnswers || []).forEach((alt) => {
      if (Array.isArray(alt)) lists.push(alt);
      else if (typeof alt === 'string' && alt.trim()) lists.push([alt]);
    });
    return lists;
  },
  evaluate(question, userAnswer) {
    const type = question.type;
    const user = String(userAnswer == null ? '' : userAnswer).trim();

    if (type === 'multiple_choice') {
      const u = Evaluator.normalize(user);
      const c = Evaluator.normalize(question.answer);
      const ok = u !== '' && u === c;
      return {
        correct: ok, score: ok ? 100 : 0,
        detail: ok ? 'Correct choice' : (u === '' ? 'No answer selected' : 'Incorrect choice'),
        matched: ok ? question.answer : null
      };
    }
    if (type === 'true_false') {
      const aliases = { t: 'true', f: 'false', y: 'true', n: 'false', yes: 'true', no: 'false' };
      const u = aliases[Evaluator.normalize(user)] || Evaluator.normalize(user);
      const c = Evaluator.normalize(question.answer);
      const ok = u !== '' && u === c;
      return {
        correct: ok, score: ok ? 100 : 0,
        detail: ok ? 'Correct' : (u === '' ? 'No answer selected' : 'Incorrect'),
        matched: ok ? question.answer : null
      };
    }
    if (type === 'command' || type === 'configuration' || type === 'show_command') {
      const lists = Evaluator.commandCandidateLists(question);
      let best = { matched: [], missing: [], extra: [], score: 0, detail: 'No expected commands defined for this question' };
      for (const list of lists) {
        const res = Evaluator.compareCommands(user, list);
        if (res.score > best.score) best = res;
      }
      best.correct = best.score === 100;
      if (best.score === 100) best.detail = 'All commands correct';
      else if (best.missing.length) {
        best.detail = best.matched.length + ' of ' + (best.missing.length + best.matched.length) + ' expected commands matched';
      }
      else best.detail = 'No commands matched';
      return best;
    }

    const candidates = [];
    const push = (a) => {
      if (typeof a === 'string' && a.trim()) candidates.push(a);
      else if (Array.isArray(a)) a.forEach(push);
    };
    push(question.answer);
    push(question.acceptableAnswers);

    if (!user) return { correct: false, score: 0, detail: 'No answer given', matched: null };
    const threshold = Storage.state.settings.tokenThreshold;
    let best = { correct: false, score: 0, matched: null };
    for (const cand of candidates) {
      const u = Evaluator.normalize(user);
      const c = Evaluator.normalize(cand);
      if (u === c) { best = { correct: true, score: 100, matched: cand }; break; }
      const ov = Evaluator.overlap(user, cand);
      if (ov > best.score) best = { correct: ov >= threshold, score: ov, matched: cand };
    }
    best.score = Math.round(best.score * 100);
    if (best.correct && best.score === 100) best.detail = 'Exact match';
    else if (best.correct) best.detail = 'Close match (' + best.score + '% similarity)';
    else if (best.score > 0) best.detail = 'Partial match (' + best.score + '% similarity)';
    else best.detail = 'Incorrect';
    return best;
  }
};

/* ============================================================
   10. FILTERING & SEARCH
   ============================================================ */
const Query = {
  defaultFilters() {
    return { chapterId: '', topicId: '', subtopicId: '', difficulty: '', type: '', tag: '', status: '', search: '' };
  },
  apply(s) {
    const f = s || {};
    let list = DataStore.questions;
    if (f.chapterId) list = list.filter((q) => q.chapterId === f.chapterId);
    if (f.topicId) list = list.filter((q) => q.topicId === f.topicId);
    if (f.subtopicId) list = list.filter((q) => q.subtopicId === f.subtopicId);
    if (f.difficulty) list = list.filter((q) => q.difficulty === f.difficulty);
    if (f.type) list = list.filter((q) => q.type === f.type);
    if (f.tag) list = list.filter((q) => q.tags.indexOf(f.tag) !== -1);
    if (f.status === 'due') list = list.filter((q) => Progress.isDue(q.id));
    else if (f.status === 'unanswered') list = list.filter((q) => !Progress.isAnswered(q.id));
    else if (f.status === 'incorrect') list = list.filter((q) => Progress.isIncorrect(q.id));
    else if (f.status === 'completed') list = list.filter((q) => Progress.isAnswered(q.id));
    else if (f.status === 'weak') {
      list = list.filter((q) => {
        const r = Progress.get(q.id);
        return !!(r && r.attempts >= Storage.state.settings.weakMinAttempts &&
          (r.correct / r.attempts) * 100 < Storage.state.settings.weakMinAccuracy);
      });
    }
    if (f.search) {
      const sq = Evaluator.normalize(f.search);
      if (sq) list = list.filter((q) => DataStore.searchIndex[q.id].indexOf(sq) !== -1);
    }
    return list;
  },
  search(query) {
    const sq = Evaluator.normalize(query);
    if (!sq) return [];
    const scored = [];
    for (const q of DataStore.questions) {
      const hay = DataStore.searchIndex[q.id];
      let score = 0;
      const pos = hay.indexOf(sq);
      if (pos !== -1) score = 1000 - pos;
      else {
        const qtokens = sq.split(' ').filter(Boolean);
        if (qtokens.length > 1 && qtokens.every((t) => hay.indexOf(t) !== -1)) score = 500 - qtokens.length;
        else if (qtokens.length) {
          const hits = qtokens.filter((t) => hay.indexOf(t) !== -1).length;
          score = hits / qtokens.length;
        }
      }
      if (score > 0) scored.push({ q: q, score: score });
    }
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, 200).map((x) => x.q);
  }
};

/* ============================================================
   11. STATISTICS
   ============================================================ */
const Stats = {
  overall() {
    let attempts = 0, correct = 0;
    for (const q of DataStore.questions) {
      const r = Progress.get(q.id);
      if (r) { attempts += r.attempts; correct += r.correct; }
    }
    const answered = DataStore.questions.filter((q) => Progress.isAnswered(q.id)).length;
    return {
      total: DataStore.questions.length,
      answered: answered,
      remaining: DataStore.questions.length - answered,
      attempts: attempts,
      correct: correct,
      incorrect: attempts - correct,
      accuracy: attempts ? Math.round((correct / attempts) * 100) : 0
    };
  },
  perChapter() {
    return DataStore.chapters.map((ch) => {
      const questions = [];
      ch.topics.forEach((t) => t.subtopics.forEach((s) => s.questions.forEach((q) => questions.push(q))));
      let attempts = 0, correct = 0, answered = 0, due = 0;
      for (const q of questions) {
        const r = Progress.get(q.id);
        if (r && r.attempts > 0) { answered++; attempts += r.attempts; correct += r.correct; }
        if (Progress.isDue(q.id)) due++;
      }
      return {
        id: ch.chapter.id, name: ch.chapter.name, description: ch.chapter.description || '',
        topics: ch.topics.length, total: questions.length, answered: answered,
        attempts: attempts, correct: correct, due: due,
        accuracy: attempts ? Math.round((correct / attempts) * 100) : 0,
        completion: questions.length ? Math.round((answered / questions.length) * 100) : 0
      };
    });
  },
  perType() {
    const map = {};
    for (const q of DataStore.questions) {
      if (!map[q.type]) map[q.type] = { type: q.type, total: 0, attempts: 0, correct: 0 };
      const cell = map[q.type];
      cell.total++;
      const r = Progress.get(q.id);
      if (r) { cell.attempts += r.attempts; cell.correct += r.correct; }
    }
    return Object.keys(map).sort((a, b) => map[b].total - map[a].total).map((k) => {
      const c = map[k];
      return { type: c.type, total: c.total, attempts: c.attempts, correct: c.correct,
        accuracy: c.attempts ? Math.round((c.correct / c.attempts) * 100) : 0 };
    });
  },
  perDifficulty() {
    const map = {};
    for (const q of DataStore.questions) {
      if (!map[q.difficulty]) map[q.difficulty] = { difficulty: q.difficulty, total: 0, attempts: 0, correct: 0 };
      const cell = map[q.difficulty];
      cell.total++;
      const r = Progress.get(q.id);
      if (r) { cell.attempts += r.attempts; cell.correct += r.correct; }
    }
    return Object.keys(map).map((k) => {
      const c = map[k];
      return { difficulty: c.difficulty, total: c.total, attempts: c.attempts, correct: c.correct,
        accuracy: c.attempts ? Math.round((c.correct / c.attempts) * 100) : 0 };
    });
  },
  weakTopics(limit) {
    const groups = new Map();
    for (const q of DataStore.questions) {
      const r = Progress.get(q.id);
      if (!r || r.attempts === 0) continue;
      const key = q.chapterId + '|' + q.topicId + '|' + q.subtopicId;
      let g = groups.get(key);
      if (!g) {
